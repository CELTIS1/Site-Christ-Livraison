backend:
  name: github
  repo: CELTIS1/Site-Christ-Livraison
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "fr"

collections:
  - name: "site"
    label: "Site web"
    files:
      - file: "content/content.json"
        label: "Contenu du site"
        name: "content"
        fields:
          - label: "Bandeau d'accueil"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Petit texte au-dessus du titre", name: "pill", widget: "string" }
              - { label: "Titre principal", name: "title", widget: "string" }
              - { label: "Texte d'introduction", name: "lead", widget: "text" }
              - label: "Photos (diaporama d'accueil)"
                name: "photos"
                widget: "list"
                label_singular: "Photo"
                hint: "Les photos s'affichent en diaporama (fondu enchaîné) sur la page d'accueil."
                field: { label: "Photo", name: "image", widget: "image" }

          - label: "Services proposés"
            name: "services"
            widget: "list"
            label_singular: "Service"
            summary: "{{title}}"
            fields:
              - label: "Icône (si pas de photo)"
                name: "icon"
                widget: "select"
                options: &icon_options
                  - { label: "Enveloppe (courrier)", value: "fa-envelope" }
                  - { label: "Boîte (colis)", value: "fa-box" }
                  - { label: "Boîte ouverte (réception)", value: "fa-box-open" }
                  - { label: "Colis empilés", value: "fa-boxes-packing" }
                  - { label: "Avion en papier (expédition)", value: "fa-paper-plane" }
                  - { label: "Panier (courses)", value: "fa-cart-shopping" }
                  - { label: "Camion", value: "fa-truck" }
                  - { label: "Moto", value: "fa-motorcycle" }
                  - { label: "Éclair (rapidité / prix)", value: "fa-bolt" }
                  - { label: "Localisation", value: "fa-location-dot" }
                  - { label: "Horloge (disponibilité)", value: "fa-clock" }
                  - { label: "Bouclier (sécurité / fiabilité)", value: "fa-shield-halved" }
                  - { label: "Pouce (satisfaction)", value: "fa-thumbs-up" }
                  - { label: "Étoile", value: "fa-star" }
                  - { label: "Poignée de main (partenariat)", value: "fa-handshake" }
                  - { label: "Calendrier (planification)", value: "fa-calendar-check" }
                  - { label: "Mallette (entreprise)", value: "fa-briefcase" }
                  - { label: "Bulle de discussion (contact)", value: "fa-comment-dots" }
                  - { label: "Boutique", value: "fa-store" }
                  - { label: "Couverts (restaurant)", value: "fa-utensils" }
                  - { label: "Mallette médicale (pharmacie)", value: "fa-briefcase-medical" }
                  - { label: "Immeuble (entreprise)", value: "fa-building" }
              - { label: "Titre du service", name: "title", widget: "string" }
              - { label: "Description courte (carte d'accueil)", name: "text", widget: "text" }
              - { label: "Photo (remplace l'icône si renseignée)", name: "photo", widget: "image", required: false }
              - label: "Identifiant de la page (dans l'adresse)"
                name: "slug"
                widget: "string"
                required: false
                hint: "Utilisé dans l'adresse de la page détail (ex : express → services.html?s=express). Lettres minuscules, sans espace ni accent. À ne pas modifier pour les services existants."
              - label: "Accroche (page détail)"
                name: "tag"
                widget: "string"
                required: false
                hint: "Phrase courte affichée sous le titre, en haut de la page détail du service."
              - label: "Présentation détaillée"
                name: "intro"
                widget: "text"
                required: false
                hint: "Paragraphe « Le service en détail » sur la page du service."
              - label: "Ce qui est inclus"
                name: "feats"
                widget: "list"
                required: false
                label_singular: "Élément"
                hint: "Liste des points inclus dans le service."
                field: { label: "Élément", name: "value", widget: "string" }
              - label: "Comment ça marche (étapes)"
                name: "steps"
                widget: "list"
                required: false
                label_singular: "Étape"
                summary: "{{title}}"
                fields:
                  - { label: "Titre de l'étape", name: "title", widget: "string" }
                  - { label: "Description", name: "text", widget: "text" }
              - label: "Idéal pour"
                name: "ideal"
                widget: "list"
                required: false
                label_singular: "Cas d'usage"
                hint: "À qui / à quoi ce service est destiné."
                field: { label: "Cas d'usage", name: "value", widget: "string" }
              - label: "Zones & délais"
                name: "delais"
                widget: "text"
                required: false
                hint: "Zones couvertes et délais indicatifs pour ce service."
              - label: "Tarifs"
                name: "tarif"
                widget: "text"
                required: false
                hint: "Indication de prix affichée dans l'encart « Tarifs » de la page détail."
              - label: "Questions fréquentes (ce service)"
                name: "faq"
                widget: "list"
                required: false
                label_singular: "Question"
                summary: "{{question}}"
                fields:
                  - { label: "Question", name: "question", widget: "string" }
                  - { label: "Réponse", name: "answer", widget: "text" }

          - label: "Comment ça marche"
            name: "how_it_works"
            widget: "object"
            fields:
              - { label: "Petit texte au-dessus du titre", name: "eyebrow", widget: "string" }
              - { label: "Titre de la section", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "text" }
              - label: "Étapes"
                name: "steps"
                widget: "list"
                label_singular: "Étape"
                summary: "{{title}}"
                fields:
                  - { label: "Icône", name: "icon", widget: "select", options: *icon_options }
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Description", name: "text", widget: "text" }

          - label: "Arguments clés"
            name: "trust"
            widget: "list"
            label_singular: "Argument"
            summary: "{{title}}"
            fields:
              - { label: "Icône", name: "icon", widget: "select", options: *icon_options }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Description", name: "text", widget: "string" }

          - label: "Zone de couverture"
            name: "coverage"
            widget: "object"
            fields:
              - { label: "Petit texte au-dessus du titre", name: "eyebrow", widget: "string" }
              - { label: "Titre de la section", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "text" }
              - label: "Zones livrées"
                name: "zones"
                widget: "list"
                label_singular: "Zone"
                summary: "{{title}}"
                fields:
                  - { label: "Nom (affiché sur le bouton de sélection)", name: "name", widget: "string" }
                  - label: "Groupe"
                    name: "group"
                    widget: "select"
                    options:
                      - { label: "Commune d'Abidjan", value: "communes" }
                      - { label: "Périphérie", value: "peripherie" }
                    default: "communes"
                    hint: "Détermine sous quel titre (Communes d'Abidjan / Périphérie) le bouton apparaît."
                  - { label: "Étiquette du badge (ex : Quartier d'affaires, Périphérie)", name: "tag", widget: "string" }
                  - { label: "Titre de la carte", name: "title", widget: "string" }
                  - { label: "Description", name: "text", widget: "text" }
                  - { label: "Mots-clés (séparés par ·)", name: "keywords", widget: "string" }
              - { label: "Titre de l'encart de fin", name: "cta_title", widget: "string" }
              - { label: "Texte de l'encart de fin", name: "cta_text", widget: "string" }

          - label: "À propos"
            name: "about"
            widget: "object"
            fields:
              - { label: "Petit texte au-dessus du titre", name: "eyebrow", widget: "string" }
              - { label: "Titre de la section", name: "title", widget: "string" }
              - { label: "Texte de présentation", name: "text", widget: "text" }
              - label: "Nos valeurs"
                name: "values"
                widget: "list"
                label_singular: "Valeur"
                summary: "{{title}}"
                fields:
                  - { label: "Icône", name: "icon", widget: "select", options: *icon_options }
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Description", name: "text", widget: "text" }
              - label: "Chiffres clés"
                name: "stats"
                widget: "list"
                label_singular: "Statistique"
                summary: "{{label}}"
                fields:
                  - { label: "Chiffre (ex : 49, 1000 FCFA)", name: "number", widget: "string" }
                  - { label: "Légende", name: "label", widget: "string" }

          - label: "Bandeau partenaires"
            name: "partners_band"
            widget: "object"
            fields:
              - { label: "Texte du bandeau", name: "label", widget: "string" }
              - label: "Types de partenaires"
                name: "items"
                widget: "list"
                label_singular: "Élément"
                summary: "{{label}}"
                fields:
                  - { label: "Icône", name: "icon", widget: "select", options: *icon_options }
                  - { label: "Libellé", name: "label", widget: "string" }

          - label: "Témoignages"
            name: "testimonials"
            widget: "object"
            fields:
              - { label: "Petit texte au-dessus du titre", name: "eyebrow", widget: "string" }
              - { label: "Titre de la section", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "text" }
              - label: "Avis clients"
                name: "items"
                widget: "list"
                label_singular: "Témoignage"
                summary: "{{name}}"
                fields:
                  - { label: "Nom du client", name: "name", widget: "string" }
                  - { label: "Rôle / activité", name: "role", widget: "string" }
                  - { label: "Note (1 à 5)", name: "rating", widget: "number", min: 1, max: 5, value_type: "int" }
                  - { label: "Avis", name: "text", widget: "text" }

          - label: "Questions fréquentes"
            name: "faq"
            widget: "object"
            fields:
              - { label: "Petit texte au-dessus du titre", name: "eyebrow", widget: "string" }
              - { label: "Titre de la section", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "text" }
              - label: "Questions"
                name: "items"
                widget: "list"
                label_singular: "Question"
                summary: "{{question}}"
                fields:
                  - { label: "Question", name: "question", widget: "string" }
                  - { label: "Réponse", name: "answer", widget: "text" }

          - label: "Coordonnées de contact"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Numéro WhatsApp (chiffres uniquement, ex : 2250546818640)", name: "whatsapp_number", widget: "string", hint: "Indicatif pays + numéro, sans + ni espaces" }
              - { label: "Numéro WhatsApp affiché sur le site", name: "whatsapp_display", widget: "string" }
              - { label: "Numéro de téléphone (ex : +2250711138693)", name: "phone_number", widget: "string" }
              - { label: "Numéro de téléphone affiché", name: "phone_display", widget: "string" }
              - { label: "Adresse email", name: "email", widget: "string" }
              - { label: "Nom affiché sur Facebook", name: "facebook", widget: "string" }
              - { label: "Nom affiché sur Instagram", name: "instagram", widget: "string" }

          - label: "Mentions légales"
            name: "legal"
            widget: "object"
            fields:
              - { label: "Capital social", name: "capital", widget: "string" }
              - { label: "Siège social", name: "siege", widget: "string" }
              - { label: "Numéro RCCM", name: "rccm", widget: "string" }
