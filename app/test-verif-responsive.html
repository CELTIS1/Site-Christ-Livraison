<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Test responsive tableaux - vues empilees</title>
<style>
  body{font-family:Arial, sans-serif; padding:20px; background:#eef1f4;}
  h2{color:#1B4374; margin:24px 0 8px 0;}
  .frame-wrap{border:2px solid #1B4374; border-radius:8px; overflow:hidden; background:#fff;}
  iframe{border:none; display:block;}
  .label{font-size:12px; color:#4E6B8A; margin-bottom:6px;}
</style>
</head>
<body>

<h2>Tablette (768px de large)</h2>
<div class="label">Simulation d'un iPad en portrait</div>
<div class="frame-wrap" style="width:768px;">
  <iframe src="test-verif-tableaux.html" style="width:768px; height:700px;"></iframe>
</div>

<h2>Telephone (390px de large)</h2>
<div class="label">Simulation d'un iPhone standard</div>
<div class="frame-wrap" style="width:390px;">
  <iframe src="test-verif-tableaux.html" style="width:390px; height:900px;"></iframe>
</div>

</body>
</html>
