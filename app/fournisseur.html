<div class="wrap">
  <div class="page-title">Bonjour <span id="user-first-name"></span> 👋</div>
  <div class="page-sub">Ajoutez vos colis à livrer et suivez leur statut en temps réel.</div>

  <div class="card" id="section-ajouter">
    <h2 class="panel-subtitle collapsible-header" onclick="toggleSection(this,'ajouter-content')">
      <span class="collapse-arrow">▶</span> Ajouter des colis

        <button type="button" class="btn btn-outline btn-sm" id="btn-add-row" style="margin-bottom:18px;">+ Ajouter un autre colis</button>
        <div>
          <button type="submit" class="btn" id="btn-submit-colis">Enregistrer les colis</button>

      <span class="collapse-arrow" id="recap-arrow">▶</span> Récapitulatif

        <div class="field">

        </div>
        <div class="field">
          <label>Choisir un jour</label>

    <h2>Mes colis</h2>
    <div class="search-wrap"><input type="text" id="search-colis" class="search-input" placeholder="Rechercher par description ou destination..."></div>
    <div class="date-filter-wrap">
      <label for="filtre-date-colis">📅 Date</label>
      <input type="date" id="filtre-date-colis" class="date-filter-input">
      <button type="button" id="btn-toutes-dates" class="date-filter-clear">Toutes les dates</button>
    </div>
    <div class="colis-list" id="colis-list">
      <div class="empty-state">Chargement...</div>
    </div>
  </div>
</div>

<script src="config.js?v=20260730"></script>
<script>
  let currentUser = null;
  let currentProfile = null;
  let rowCount = 0;
  let mesColis = [];
  let searchColis = '';
  let filtreDate = '';
  let livreursById = {};

  async function loadLivreurs(){
    const { data, error } = await supabaseClient
      .from('profiles')
      .select('id, full_name, avatar_url')
      .eq('role', 'livreur');
    if (error) { console.error(error); return; }
    livreursById = {};
    data.forEach(l => { livreursById[l.id] = l; });
  }

  function closeOtherSections(exceptContentId){
    document.querySelectorAll('.card > .collapsible-content').forEach(c => {
      if (c.id === exceptContentId) return;
      if (c.classList.contains('open')){
        collapseCollapsible(c);
        const h = c.previousElementSibling;
        const arr = h && h.querySelector('.collapse-arrow');
        if (arr) arr.textContent = '▶';
      }
    });
  }

  // Sur mobile (surtout Safari/iOS), les colonnes/en-têtes "sticky" d'un tableau
  // qui était masqué (max-height:0) ne se repositionnent pas toujours correctement
  // une fois la section ré-ouverte. On force un recalcul de mise en page une fois
  // l'animation d'ouverture terminée.
  function refreshStickyTables(container){
    if (!container) return;
    const onEnd = (e) => {
      if (e.target !== container || e.propertyName !== 'max-height') return;
      container.removeEventListener('transitionend', onEnd);
      const wraps = container.classList.contains('recap-table-wrap')
        ? [container]
        : container.querySelectorAll('.recap-table-wrap');
      wraps.forEach(w => {
        const prevDisplay = w.style.display;
        w.style.display = 'none';
        void w.offsetHeight; // force le reflow
        w.style.display = prevDisplay;
      });
    };
    container.addEventListener('transitionend', onEnd);
  }

  function toggleSection(header, contentId){
    const content = document.getElementById(contentId);
    const willOpen = !content.classList.contains('open');
    if (willOpen) closeOtherSections(contentId);
    if (willOpen) { expandCollapsible(content); } else { collapseCollapsible(content); }
    const arrow = header.querySelector('.collapse-arrow');
    if (arrow) arrow.textContent = willOpen ? '▼' : '▶';
    if (willOpen) refreshStickyTables(content);
  }

  // Scroll-spy : met en surbrillance douce le lien du menu correspondant à la section visible,
  // et ouvre automatiquement une section repliable + fait un léger flash sur son titre lors d'un clic.
  (function initSubnavScrollSpy(){
    const links = Array.from(document.querySelectorAll('.subnav a'));
    if (!links.length) return;
    const sections = links.map(a => document.querySelector(a.getAttribute('href'))).filter(Boolean);
    if (!sections.length) return;

    let suppressUntil = 0;

    const setActive = (id) => {
      links.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + id));
    };

    const observer = new IntersectionObserver((entries) => {
      if (Date.now() < suppressUntil) return;
      const visible = entries.filter(e => e.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio);
      if (visible.length) setActive(visible[0].target.id);
    }, { rootMargin: '-72px 0px -60% 0px', threshold: [0, 0.1, 0.25, 0.5] });

    sections.forEach(s => observer.observe(s));

    links.forEach(a => {
      a.addEventListener('click', () => {
        const id = a.getAttribute('href').slice(1);
        const section = document.getElementById(id);
        if (!section) return;

        // Fixe immédiatement l'onglet actif sur la section cliquée, et ignore
        // temporairement le scroll-spy le temps que le saut d'ancre et l'animation
        // d'ouverture se terminent (sinon l'onglet en surbrillance peut sauter sur
        // la section voisine pendant la transition).
        setActive(id);
        suppressUntil = Date.now() + 900;

        const header = section.querySelector('.collapsible-header');
        if (header) {
          const content = header.nextElementSibling;
          if (content && !content.classList.contains('open')) header.click();
        }

        const title = section.querySelector('.panel-subtitle, h2, h3');
        if (title) {
          title.classList.remove('section-flash-title');
          void title.offsetWidth;
          title.classList.add('section-flash-title');
        }
      });
    });
  })();

  function matchesSearch(c, term){
    if (!term) return true;
    const t = term.toLowerCase();
    const desc = (c.description || '').toLowerCase();
    const dest = (c.destination || '').toLowerCase();
    return desc.includes(t) || dest.includes(t);
  }

  function matchesDate(c, dateStr){
    if (!dateStr) return true;
    return dayKey(c.created_at) === dateStr;
  }

  function todayLocalISODate(){
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function newRowHTML(idx){
    return `
      <div class="colis-row" data-row="${idx}">
        ${idx > 0 ? `<button type="button" class="remove-row" onclick="removeRow(${idx})">Retirer ✕</button>` : ''}
        <div class="field">
          <label>Description du colis</label>
          <textarea class="row-desc" placeholder="Ex : Carton de vêtements, 5kg" required></textarea>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Destination</label>
            <input type="text" class="row-dest" placeholder="Ex : Cocody, Angré">
          </div>
          <div class="field">
            <label>Montant (optionnel)</label>
            <input type="number" class="row-montant" placeholder="Ex : 5000" min="0" step="any">
          </div>
        </div>
        <div class="field">
          <label>Photo (optionnel)</label>
          <div class="photo-pick-group">
            <div class="avatar-upload-btns">
              <label class="btn btn-outline btn-sm" style="cursor:pointer;">📷 Prendre une photo<input type="file" accept="image/*" capture="user" class="hidden pick-camera"></label>
              <label class="btn btn-outline btn-sm" style="cursor:pointer;">🖼️ Bibliothèque<input type="file" accept="image/*" class="hidden pick-library"></label>
            </div>
            <div class="photo-pick-filename"></div>
          </div>
        </div>
      </div>
    `;
  }

  function addRow(){
    document.getElementById('colis-rows').insertAdjacentHTML('beforeend', newRowHTML(rowCount));
    rowCount++;
  }
  function removeRow(idx){
    const el = document.querySelector(`.colis-row[data-row="${idx}"]`);
    if (el) el.remove();
  }
  document.getElementById('btn-add-row').addEventListener('click', addRow);

  function addMsg(text, type){
    document.getElementById('add-msg').innerHTML = `<div class="msg msg-${type}">${escapeHTML(text)}</div>`;
  }

  async function uploadPhoto(file, userId){
    const ext = file.name.split('.').pop();
    const path = `${userId}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const { error } = await supabaseClient.storage.from('colis-photos').upload(path, file);
    if (error) { console.error(error); return null; }
    const { data } = supabaseClient.storage.from('colis-photos').getPublicUrl(path);
    return data.publicUrl;
  }

  document.getElementById('form-add-colis').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-submit-colis');
    btn.disabled = true; btn.textContent = 'Enregistrement...';

    const rows = document.querySelectorAll('.colis-row');
    const inserts = [];
    let photoUploadFailed = false;

    for (const row of rows) {
      const description = row.querySelector('.row-desc').value.trim();
      const destination = row.querySelector('.row-dest').value.trim();
      const montantRaw = row.querySelector('.row-montant').value.trim();
      const montant = montantRaw === '' ? null : Number(montantRaw);
      const pickedPhoto = pickedGroupFile(row.querySelector('.photo-pick-group'));
      let photo_url = null;

      if (pickedPhoto) {
        photo_url = await uploadPhoto(pickedPhoto, currentUser.id);
        if (!photo_url) photoUploadFailed = true;
      }

      inserts.push({
        fournisseur_id: currentUser.id,
        description,
        destination,
        montant,
        photo_url,
      });
    }

    const { error } = await supabaseClient.from('colis').insert(inserts);
    btn.disabled = false; btn.textContent = 'Enregistrer les colis';

    if (error) {
      addMsg("Erreur lors de l'enregistrement : " + error.message, "error");
      return;
    }

    const photoWarning = photoUploadFailed ? " (attention : l'envoi d'au moins une photo a échoué, le colis a été enregistré sans photo)" : "";
    addMsg(`${inserts.length} colis enregistré(s) avec succès${photoWarning}.`, "success");
    document.getElementById('colis-rows').innerHTML = '';
    rowCount = 0;
    addRow();
    loadColis();
  });

  function colisItemHTML(c){
    const thumb = c.photo_url
      ? `<img src="${c.photo_url}" class="thumb">`
      : `<div class="thumb-placeholder">Pas de photo</div>`;
    const livreur = c.livreur_id ? livreursById[c.livreur_id] : null;
    const livreurBlock = livreur
      ? `<div class="livreur-meta">${avatarHTML(livreur, 20)} <span>Livreur : ${escapeHTML(livreur.full_name || 'Livreur')}</span></div>`
      : (c.statut !== 'en_attente' ? `<div class="meta">Livreur : en cours d'attribution</div>` : '');
    return `
      <div class="colis-item" data-id="${c.id}">
        ${thumb}
        <div class="info">
          <div class="view-mode">
            <div class="desc">${c.description ? escapeHTML(c.description) : '(sans description)'}</div>
            <div class="meta">${c.destination ? 'Vers : ' + escapeHTML(c.destination) + ' · ' : ''}Ajouté le ${formatDate(c.created_at)}</div>
            ${formatMontant(c.montant) ? `<div class="meta">Montant : ${formatMontant(c.montant)}</div>` : ''}
            ${livreurBlock}
            ${c.observation ? `<div class="obs-display"><strong>Observation :</strong> ${escapeHTML(c.observation)}</div>` : ''}
            ${c.photo_livraison_url ? `<div class="meta">Preuve de livraison : <img src="${c.photo_livraison_url}" class="thumb" style="vertical-align:middle; margin-left:6px;"></div>` : ''}
          </div>
          <div class="edit-mode hidden">
            <div class="field">
              <label>Description du colis</label>
              <textarea class="edit-desc">${escapeHTML(c.description || '')}</textarea>
            </div>
            <div class="field-row">
              <div class="field">
                <label>Destination</label>
                <input type="text" class="edit-dest" value="${escapeHTML(c.destination || '')}">
              </div>
              <div class="field">
                <label>Montant</label>
                <input type="number" class="edit-montant" min="0" step="any" value="${c.montant !== null && c.montant !== undefined ? c.montant : ''}">
              </div>
            </div>
            <div style="display:flex; gap:8px;">
              <button type="button" class="btn btn-sm btn-save-edit">Enregistrer</button>
              <button type="button" class="btn btn-outline btn-sm btn-cancel-edit">Annuler</button>
            </div>
          </div>
        </div>
        <div class="status-col">
          ${statutBadgeHTML(c.statut)}
          ${c.statut === 'en_attente' ? `
            <button type="button" class="btn btn-sm btn-outline btn-edit-colis" style="margin-top:8px;">Modifier</button>
            <button type="button" class="btn btn-sm btn-delete-colis" style="background:#c0392b;">Supprimer</button>
          ` : ''}
        </div>
      </div>
    `;
  }

  function attachColisHandlers(list){
    list.querySelectorAll('.btn-edit-colis').forEach(btn => {
      btn.addEventListener('click', () => {
        const item = btn.closest('.colis-item');
        item.querySelector('.view-mode').classList.add('hidden');
        item.querySelector('.edit-mode').classList.remove('hidden');
      });
    });
    list.querySelectorAll('.btn-cancel-edit').forEach(btn => {
      btn.addEventListener('click', () => {
        const item = btn.closest('.colis-item');
        item.querySelector('.edit-mode').classList.add('hidden');
        item.querySelector('.view-mode').classList.remove('hidden');
      });
    });
    list.querySelectorAll('.btn-save-edit').forEach(btn => {
      btn.addEventListener('click', async () => {
        const item = btn.closest('.colis-item');
        const id = item.dataset.id;
        const description = item.querySelector('.edit-desc').value.trim();
        const destination = item.querySelector('.edit-dest').value.trim();
        const montantRaw = item.querySelector('.edit-montant').value.trim();
        const montant = montantRaw === '' ? null : Number(montantRaw);
        btn.disabled = true; btn.textContent = '...';
        const { error } = await supabaseClient.from('colis').update({ description, destination, montant }).eq('id', id);
        if (error) {
          alert("Erreur : " + error.message);
          btn.disabled = false; btn.textContent = 'Enregistrer';
          return;
        }
        loadColis();
      });
    });
    list.querySelectorAll('.btn-delete-colis').forEach(btn => {
      btn.addEventListener('click', async () => {
        const item = btn.closest('.colis-item');
        const id = item.dataset.id;
        if (!confirm("Supprimer définitivement ce colis ? Cette action est irréversible.")) return;
        btn.disabled = true; btn.textContent = '...';
        const { error } = await supabaseClient.from('colis').delete().eq('id', id);
        if (error) {
          alert("Erreur : " + error.message);
          btn.disabled = false; btn.textContent = 'Supprimer';
          return;
        }
        loadColis();
      });
    });
  }

  function renderColisList(){
    const list = document.getElementById('colis-list');
    const __anchor = captureScrollAnchor(list);
    const filtered = mesColis.filter(c => matchesSearch(c, searchColis) && matchesDate(c, filtreDate));
    if (!mesColis.length) {
      list.innerHTML = `<div class="empty-state">Aucun colis pour le moment. Ajoutez votre premier colis ci-dessus.</div>`;
    } else if (!filtered.length) {
      list.innerHTML = filtreDate
        ? `<div class="empty-state">Aucun colis enregistré à cette date.</div>`
        : `<div class="empty-state">Aucun colis ne correspond à cette recherche.</div>`;
    } else if (filtreDate) {
      // Une date précise est choisie : la liste est déjà limitée à cette journée,
      // inutile de répéter l'en-tête "📅 ..." (déjà visible dans le sélecteur de date).
      list.innerHTML = filtered.map(colisItemHTML).join('');
      attachColisHandlers(list);
    } else {
      const groups = groupColisByDay(filtered);
      list.innerHTML = renderGroupedColisHTML(groups, colisItemHTML);
      attachColisHandlers(list);
    }
    populateMoisSelect();
    restoreScrollAnchor(list, __anchor);
  }

  async function loadColis(){
    const { data, error } = await supabaseClient
      .from('colis')
      .select('*')
      .eq('fournisseur_id', currentUser.id)
      .order('created_at', { ascending: false });

    const list = document.getElementById('colis-list');
    if (error) {
      list.innerHTML = `<div class="empty-state">Erreur de chargement.</div>`;
      return;
    }
    mesColis = data;
    renderColisList();
  }

  function toggleRecap(){
    const content = document.getElementById('recap-content');
    const willOpen = !content.classList.contains('open');
    if (willOpen) closeOtherSections('recap-content');
    if (willOpen) { expandCollapsible(content); } else { collapseCollapsible(content); }
    document.getElementById('recap-arrow').textContent = willOpen ? '▼' : '▶';
    if (willOpen) refreshStickyTables(content);
  }

  const RECAP_ICONS = { en_attente:'⏳', recupere:'📦', en_livraison:'🚚', livre:'✅', non_livre:'⚠️', retour:'↩️' };

  function statTilesHTML(compte, total){
    const tiles = Object.keys(STATUTS).map(k => `
      <div class="stat-tile" style="--tile-color:${STATUTS[k].color}; --tile-bg:${STATUTS[k].bg}">
        <div class="stat-tile-icon">${RECAP_ICONS[k] || '📦'}</div>
        <div class="stat-tile-value">${compte[k] || 0}</div>
        <div class="stat-tile-label">${STATUTS[k].label}</div>
      </div>`).join('');
    return `
      <div class="stat-tiles">
        <div class="stat-tile stat-tile-total">
          <div class="stat-tile-icon">📋</div>
          <div class="stat-tile-value">${total}</div>
          <div class="stat-tile-label">Total colis</div>
        </div>
        ${tiles}
      </div>`;
  }

  function monthKey(iso){
    if (!iso) return '';
    return iso.slice(0, 7);
  }

  function monthLabel(key){
    if (!key) return '';
    const [y, m] = key.split('-');
    const d = new Date(parseInt(y, 10), parseInt(m, 10) - 1, 1);
    return d.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
  }

  function populateMoisSelect(){
    const select = document.getElementById('mois-select');
    const keys = Array.from(new Set(mesColis.map(c => monthKey(c.created_at)))).filter(Boolean).sort((a, b) => b.localeCompare(a));
    const previousValue = select.value;
    select.innerHTML = keys.map(k => `<option value="${k}">${monthLabel(k)}</option>`).join('');
    if (keys.includes(previousValue)) {
      select.value = previousValue;
    } else if (keys.length) {
      select.value = keys[0];
    }
    renderRecapMois();
  }

  function populateJourSelect(groups){
    const jourSelect = document.getElementById('jour-select');
    const previousValue = jourSelect.value;
    const options = groups.map(g => `<option value="${g.key}">${g.label}</option>`).join('');
    jourSelect.innerHTML = `<option value="">Tous les jours</option>${options}`;
    jourSelect.value = groups.some(g => g.key === previousValue) ? previousValue : '';
  }

  function renderRecapMois(){
    const box = document.getElementById('recap-mois');
    const select = document.getElementById('mois-select');
    const selected = select.value;
    if (!selected) {
      box.innerHTML = `<div class="empty-state">Aucun colis pour le moment.</div>`;
      populateJourSelect([]);
      return;
    }
    const colisDuMois = mesColis.filter(c => monthKey(c.created_at) === selected);
    if (!colisDuMois.length) {
      box.innerHTML = `<div class="empty-state">Aucun colis pour ce mois.</div>`;
      populateJourSelect([]);
      return;
    }
    const groups = groupColisByDay(colisDuMois, 'created_at');
    populateJourSelect(groups);
    const jourSelected = document.getElementById('jour-select').value;

    if (jourSelected) {
      const g = groups.find(x => x.key === jourSelected);
      if (g) {
        const compteJour = {};
        g.items.forEach(c => { compteJour[c.statut] = (compteJour[c.statut] || 0) + 1; });
        const livresJour = compteJour['livre'] || 0;
        const tauxJour = g.items.length ? Math.round((livresJour / g.items.length) * 100) : 0;
        box.innerHTML = `
          <div class="day-recap-back" onclick="selectRecapDay('')">← Voir tout le mois</div>
          <p class="recap-phrase">Le <strong>${g.label}</strong>, vous avez enregistré <strong>${g.items.length} colis</strong>, dont <strong>${livresJour}</strong> livré${livresJour > 1 ? 's' : ''} avec succès (${tauxJour}%).</p>
          ${statTilesHTML(compteJour, g.items.length)}
        `;
        return;
      }
    }

    const compte = {};
    colisDuMois.forEach(c => { compte[c.statut] = (compte[c.statut] || 0) + 1; });
    const livres = compte['livre'] || 0;
    const taux = colisDuMois.length ? Math.round((livres / colisDuMois.length) * 100) : 0;

    const joursHTML = groups.map(g => {
      const compteJour = {};
      g.items.forEach(c => { compteJour[c.statut] = (compteJour[c.statut] || 0) + 1; });
      const pills = Object.keys(STATUTS).filter(k => compteJour[k]).map(k => `
        <span class="mini-pill" style="--pill-color:${STATUTS[k].color}; --pill-bg:${STATUTS[k].bg}">${RECAP_ICONS[k] || ''} ${compteJour[k]} ${STATUTS[k].label}</span>
      `).join('');
      return `
        <div class="day-recap-row" data-day-key="${g.key}" onclick="selectRecapDay('${g.key}')">
          <div class="day-recap-date">${g.label}</div>
          <div class="day-recap-count">${g.items.length} colis</div>
          <div class="day-recap-pills">${pills}</div>
        </div>`;
    }).join('');

    box.innerHTML = `
      <p class="recap-phrase">En <strong>${monthLabel(selected)}</strong>, vous avez enregistré <strong>${colisDuMois.length} colis</strong>, dont <strong>${livres}</strong> livré${livres > 1 ? 's' : ''} avec succès (${taux}%).</p>
      ${statTilesHTML(compte, colisDuMois.length)}
      <div class="day-recap-title">Détail par jour</div>
      <div class="day-recap-list">${joursHTML}</div>
    `;
  }

  function selectRecapDay(key){
    document.getElementById('jour-select').value = key;
    renderRecapMois();
  }

  document.getElementById('mois-select').addEventListener('change', renderRecapMois);
  document.getElementById('jour-select').addEventListener('change', renderRecapMois);

  async function init(){
    const session = await requireAuth();
    if (!session) return;
    currentUser = session.user;

    const profile = await getProfile(currentUser.id);
    if (profile && profile.role === 'equipe') {
      window.location.href = 'equipe.html';
      return;
    }
    if (profile && profile.role === 'livreur') {
      window.location.href = 'livreur.html';
      return;
    }

    // Sécurité : un compte fournisseur pas encore validé (ou refusé) par l'équipe ne doit
    // jamais accéder au tableau de bord, même si une session est restée active pendant l'attente.
    if (!profile || profile.status !== 'valide') {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
      return;
    }

    currentProfile = profile;
    document.getElementById('user-name').textContent = profile ? (profile.company_name || profile.full_name || '') : '';
    document.getElementById('user-first-name').textContent = profile ? (profile.full_name || '') : '';
    initAvatarUpload({ profile, previewContainerId: 'avatar-preview', topbarContainerId: 'user-avatar-topbar', cameraInputId: 'avatar-input-camera', libraryInputId: 'avatar-input-library', statusId: 'avatar-msg' });
    initSettingsMenu();

    addRow();
    await loadLivreurs();
    filtreDate = todayLocalISODate();
    document.getElementById('filtre-date-colis').value = filtreDate;
    loadColis();
    document.getElementById('search-colis').addEventListener('input', (e) => { searchColis = e.target.value; renderColisList(); });
    document.getElementById('filtre-date-colis').addEventListener('change', (e) => { filtreDate = e.target.value; renderColisList(); });
    document.getElementById('btn-toutes-dates').addEventListener('click', () => {
      filtreDate = '';
      document.getElementById('filtre-date-colis').value = '';
      renderColisList();
    });

    // Mises à jour en temps réel : tout changement sur mes colis rafraîchit la liste
    supabaseClient
      .channel('colis-fournisseur-' + currentUser.id)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'colis', filter: `fournisseur_id=eq.${currentUser.id}` }, () => {
        loadColis();
      })
      .subscribe();
  }

  document.getElementById('form-change-password').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-change-password');
    const msgBox = document.getElementById('change-pwd-msg');
    const newPassword = document.getElementById('new-password').value;
    const confirmPassword = document.getElementById('new-password-confirm').value;

    if (newPassword !== confirmPassword) {
      msgBox.innerHTML = `<div class="msg msg-error">Les deux mots de passe ne correspondent pas.</div>`;
      return;
    }
    if (newPassword.length < 6) {
      msgBox.innerHTML = `<div class="msg msg-error">Le mot de passe doit contenir au moins 6 caractères.</div>`;
      return;
    }

    btn.disabled = true; btn.textContent = 'Modification...';
    const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
    btn.disabled = false; btn.textContent = 'Changer mon mot de passe';

    if (error) {
      msgBox.innerHTML = `<div class="msg msg-error">Erreur : ${error.message}</div>`;
    } else {
      msgBox.innerHTML = `<div class="msg msg-success">Mot de passe modifié avec succès.</div>`;
      e.target.reset();
    }
  });

  init();
</script>
</body>
</html>
