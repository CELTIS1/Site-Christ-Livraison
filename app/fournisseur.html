<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace Fournisseur | Christ Livraison & Transport SARL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

<div class="topbar">
  <div class="brand"><div class="logo-mark">CLT</div> Espace Colis — Fournisseur</div>
  <div class="user-info">
    <span id="user-name"></span>
    <span class="role-pill">Fournisseur</span>
    <button class="btn-logout" onclick="logout()">Déconnexion</button>
  </div>
</div>

<div class="wrap">
  <div class="page-title">Bonjour <span id="user-first-name"></span> 👋</div>
  <div class="page-sub">Ajoutez vos colis à livrer et suivez leur statut en temps réel.</div>

  <div class="card">
    <h2>Mon compte</h2>
    <div id="change-pwd-msg"></div>
    <form id="form-change-password">
      <div class="field-row">
        <div class="field">
          <label>Nouveau mot de passe</label>
          <input type="password" id="new-password" required minlength="6" placeholder="6 caractères minimum">
        </div>
        <div class="field">
          <label>Confirmer le nouveau mot de passe</label>
          <input type="password" id="new-password-confirm" required minlength="6" placeholder="Retapez le mot de passe">
        </div>
      </div>
      <button type="submit" class="btn" id="btn-change-password">Changer mon mot de passe</button>
    </form>
  </div>

  <div class="card">
    <h2>Ajouter des colis</h2>
    <div id="add-msg"></div>
    <form id="form-add-colis">
      <div id="colis-rows"></div>
      <button type="button" class="btn btn-outline btn-sm" id="btn-add-row" style="margin-bottom:18px;">+ Ajouter un autre colis</button>
      <div>
        <button type="submit" class="btn" id="btn-submit-colis">Enregistrer les colis</button>
      </div>
    </form>
  </div>

  <div class="card">
    <h2>Récapitulatif</h2>
    <div class="recap-table-wrap" id="recap-statuts">
      <div class="empty-state">Chargement...</div>
    </div>
    <div class="field" style="max-width:260px; margin-top:20px;">
      <label>Vue par mois</label>
      <select id="mois-select"></select>
    </div>
    <div id="recap-mois" style="margin-top:12px;">
      <div class="empty-state">Chargement...</div>
    </div>
  </div>

  <div class="card">
    <h2>Comptabilité</h2>
    <div class="field-row">
      <div class="field">
        <label>Du</label>
        <input type="date" id="compta-date-debut">
      </div>
      <div class="field">
        <label>Au</label>
        <input type="date" id="compta-date-fin">
      </div>
    </div>
    <div id="compta-summary" style="margin:12px 0;"></div>
    <div class="recap-table-wrap" id="compta-detail">
      <div class="empty-state">Chargement...</div>
    </div>
    <div style="display:flex; gap:8px; margin-top:14px;">
      <button type="button" class="btn btn-outline btn-sm" id="btn-export-excel">Exporter en Excel</button>
      <button type="button" class="btn btn-outline btn-sm" id="btn-export-pdf">Exporter en PDF</button>
    </div>
  </div>

  <div class="card">
    <h2>Mes colis</h2>
    <div class="search-wrap"><input type="text" id="search-colis" class="search-input" placeholder="Rechercher par description ou destination..."></div>
    <div class="colis-list" id="colis-list">
      <div class="empty-state">Chargement...</div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
  let currentUser = null;
  let currentProfile = null;
  let rowCount = 0;
  let mesColis = [];
  let searchColis = '';

  function matchesSearch(c, term){
    if (!term) return true;
    const t = term.toLowerCase();
    const desc = (c.description || '').toLowerCase();
    const dest = (c.destination || '').toLowerCase();
    return desc.includes(t) || dest.includes(t);
  }

  function newRowHTML(idx){
    return `
      <div class="colis-row" data-row="${idx}">
        ${idx > 0 ? `<button type="button" class="remove-row" onclick="removeRow(${idx})">Retirer ✕</button>` : ''}
        <div class="field">
          <label>Description du colis</label>
          <textarea class="row-desc" placeholder="Ex : Carton de vêtements, 5kg" required></textarea>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Destination</label>
            <input type="text" class="row-dest" placeholder="Ex : Cocody, Angré">
          </div>
          <div class="field">
            <label>Montant (optionnel)</label>
            <input type="number" class="row-montant" placeholder="Ex : 5000" min="0" step="any">
          </div>
        </div>
        <div class="field">
          <label>Photo (optionnel)</label>
          <input type="file" class="row-photo" accept="image/*">
        </div>
      </div>
    `;
  }

  function addRow(){
    document.getElementById('colis-rows').insertAdjacentHTML('beforeend', newRowHTML(rowCount));
    rowCount++;
  }
  function removeRow(idx){
    const el = document.querySelector(`.colis-row[data-row="${idx}"]`);
    if (el) el.remove();
  }
  document.getElementById('btn-add-row').addEventListener('click', addRow);

  function addMsg(text, type){
    document.getElementById('add-msg').innerHTML = `<div class="msg msg-${type}">${text}</div>`;
  }

  async function uploadPhoto(file, userId){
    const ext = file.name.split('.').pop();
    const path = `${userId}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const { error } = await supabaseClient.storage.from('colis-photos').upload(path, file);
    if (error) { console.error(error); return null; }
    const { data } = supabaseClient.storage.from('colis-photos').getPublicUrl(path);
    return data.publicUrl;
  }

  document.getElementById('form-add-colis').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-submit-colis');
    btn.disabled = true; btn.textContent = 'Enregistrement...';

    const rows = document.querySelectorAll('.colis-row');
    const inserts = [];
    let photoUploadFailed = false;

    for (const row of rows) {
      const description = row.querySelector('.row-desc').value.trim();
      const destination = row.querySelector('.row-dest').value.trim();
      const montantRaw = row.querySelector('.row-montant').value.trim();
      const montant = montantRaw === '' ? null : Number(montantRaw);
      const fileInput = row.querySelector('.row-photo');
      let photo_url = null;

      if (fileInput.files && fileInput.files[0]) {
        photo_url = await uploadPhoto(fileInput.files[0], currentUser.id);
        if (!photo_url) photoUploadFailed = true;
      }

      inserts.push({
        fournisseur_id: currentUser.id,
        description,
        destination,
        montant,
        photo_url,
      });
    }

    const { error } = await supabaseClient.from('colis').insert(inserts);
    btn.disabled = false; btn.textContent = 'Enregistrer les colis';

    if (error) {
      addMsg("Erreur lors de l'enregistrement : " + error.message, "error");
      return;
    }

    const photoWarning = photoUploadFailed ? " (attention : l'envoi d'au moins une photo a échoué, le colis a été enregistré sans photo)" : "";
    addMsg(`${inserts.length} colis enregistré(s) avec succès${photoWarning}.`, "success");
    document.getElementById('colis-rows').innerHTML = '';
    rowCount = 0;
    addRow();
    loadColis();
  });

  function colisItemHTML(c){
    const thumb = c.photo_url
      ? `<img src="${c.photo_url}" class="thumb">`
      : `<div class="thumb-placeholder">Pas de photo</div>`;
    return `
      <div class="colis-item" data-id="${c.id}">
        ${thumb}
        <div class="info">
          <div class="view-mode">
            <div class="desc">${c.description || '(sans description)'}</div>
            <div class="meta">${c.destination ? 'Vers : ' + c.destination + ' · ' : ''}Ajouté le ${formatDate(c.created_at)}</div>
            ${formatMontant(c.montant) ? `<div class="meta">Montant : ${formatMontant(c.montant)}</div>` : ''}
            ${c.livreur_nom ? `<div class="meta">Livreur : ${c.livreur_nom}</div>` : ''}
            ${c.observation ? `<div class="obs-display"><strong>Observation :</strong> ${escapeHTML(c.observation)}</div>` : ''}
            ${c.photo_livraison_url ? `<div class="meta">Preuve de livraison : <img src="${c.photo_livraison_url}" class="thumb" style="vertical-align:middle; margin-left:6px;"></div>` : ''}
          </div>
          <div class="edit-mode hidden">
            <div class="field">
              <label>Description du colis</label>
              <textarea class="edit-desc">${escapeHTML(c.description || '')}</textarea>
            </div>
            <div class="field-row">
              <div class="field">
                <label>Destination</label>
                <input type="text" class="edit-dest" value="${escapeHTML(c.destination || '')}">
              </div>
              <div class="field">
                <label>Montant</label>
                <input type="number" class="edit-montant" min="0" step="any" value="${c.montant !== null && c.montant !== undefined ? c.montant : ''}">
              </div>
            </div>
            <div style="display:flex; gap:8px;">
              <button type="button" class="btn btn-sm btn-save-edit">Enregistrer</button>
              <button type="button" class="btn btn-outline btn-sm btn-cancel-edit">Annuler</button>
            </div>
          </div>
        </div>
        <div class="status-col">
          ${statutBadgeHTML(c.statut)}
          <button type="button" class="btn btn-sm btn-outline btn-edit-colis" style="margin-top:8px;">Modifier</button>
          ${c.statut === 'en_attente' ? `<button type="button" class="btn btn-sm btn-delete-colis" style="background:#c0392b;">Supprimer</button>` : ''}
        </div>
      </div>
    `;
  }

  function attachColisHandlers(list){
    list.querySelectorAll('.btn-edit-colis').forEach(btn => {
      btn.addEventListener('click', () => {
        const item = btn.closest('.colis-item');
        item.querySelector('.view-mode').classList.add('hidden');
        item.querySelector('.edit-mode').classList.remove('hidden');
      });
    });
    list.querySelectorAll('.btn-cancel-edit').forEach(btn => {
      btn.addEventListener('click', () => {
        const item = btn.closest('.colis-item');
        item.querySelector('.edit-mode').classList.add('hidden');
        item.querySelector('.view-mode').classList.remove('hidden');
      });
    });
    list.querySelectorAll('.btn-save-edit').forEach(btn => {
      btn.addEventListener('click', async () => {
        const item = btn.closest('.colis-item');
        const id = item.dataset.id;
        const description = item.querySelector('.edit-desc').value.trim();
        const destination = item.querySelector('.edit-dest').value.trim();
        const montantRaw = item.querySelector('.edit-montant').value.trim();
        const montant = montantRaw === '' ? null : Number(montantRaw);
        btn.disabled = true; btn.textContent = '...';
        const { error } = await supabaseClient.from('colis').update({ description, destination, montant }).eq('id', id);
        if (error) {
          alert("Erreur : " + error.message);
          btn.disabled = false; btn.textContent = 'Enregistrer';
          return;
        }
        loadColis();
      });
    });
    list.querySelectorAll('.btn-delete-colis').forEach(btn => {
      btn.addEventListener('click', async () => {
        const item = btn.closest('.colis-item');
        const id = item.dataset.id;
        if (!confirm("Supprimer définitivement ce colis ? Cette action est irréversible.")) return;
        btn.disabled = true; btn.textContent = '...';
        const { error } = await supabaseClient.from('colis').delete().eq('id', id);
        if (error) {
          alert("Erreur : " + error.message);
          btn.disabled = false; btn.textContent = 'Supprimer';
          return;
        }
        loadColis();
      });
    });
  }

  function renderColisList(){
    const list = document.getElementById('colis-list');
    const filtered = mesColis.filter(c => matchesSearch(c, searchColis));
    if (!mesColis.length) {
      list.innerHTML = `<div class="empty-state">Aucun colis pour le moment. Ajoutez votre premier colis ci-dessus.</div>`;
    } else if (!filtered.length) {
      list.innerHTML = `<div class="empty-state">Aucun colis ne correspond à cette recherche.</div>`;
    } else {
      list.innerHTML = filtered.map(colisItemHTML).join('');
      attachColisHandlers(list);
    }
    renderRecapStatuts();
    populateMoisSelect();
    renderCompta();
  }

  function comptaFiltered(){
    const debut = document.getElementById('compta-date-debut').value;
    const fin = document.getElementById('compta-date-fin').value;
    return mesColis.filter(c => {
      const d = (c.created_at || '').slice(0, 10);
      if (debut && d < debut) return false;
      if (fin && d > fin) return false;
      return true;
    });
  }

  function renderCompta(){
    const rows = comptaFiltered();
    const summary = document.getElementById('compta-summary');
    const detail = document.getElementById('compta-detail');
    if (!rows.length) {
      summary.innerHTML = '';
      detail.innerHTML = `<div class="empty-state">Aucun colis sur cette période.</div>`;
      return;
    }
    const livres = rows.filter(c => c.statut === 'livre');
    const totalMontant = rows.reduce((s, c) => s + (Number(c.montant) || 0), 0);
    const totalMontantLivre = livres.reduce((s, c) => s + (Number(c.montant) || 0), 0);
    summary.innerHTML = `
      <div class="page-sub">
        ${rows.length} colis · ${livres.length} livré(s) ·
        Montant total : <strong>${formatMontant(totalMontant) || '0 FCFA'}</strong> ·
        Montant livré : <strong>${formatMontant(totalMontantLivre) || '0 FCFA'}</strong>
      </div>
    `;
    detail.innerHTML = `
      <table class="recap-table">
        <thead><tr><th>Colis</th><th>Destination</th><th>Statut</th><th>Montant</th><th>Date</th></tr></thead>
        <tbody>
          ${rows.map(c => `
            <tr>
              <td>${escapeHTML(c.description || '(sans description)')}</td>
              <td>${escapeHTML(c.destination || '-')}</td>
              <td>${STATUTS[c.statut] ? STATUTS[c.statut].label : c.statut}</td>
              <td>${formatMontant(c.montant) || '-'}</td>
              <td>${formatDate(c.created_at)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

  document.getElementById('compta-date-debut').addEventListener('change', renderCompta);
  document.getElementById('compta-date-fin').addEventListener('change', renderCompta);

  document.getElementById('btn-export-excel').addEventListener('click', () => {
    const rows = comptaFiltered();
    if (!rows.length) { alert("Aucune donnée à exporter."); return; }
    const data = rows.map(c => ({
      Colis: c.description || '',
      Destination: c.destination || '',
      Statut: STATUTS[c.statut] ? STATUTS[c.statut].label : c.statut,
      Montant: c.montant || 0,
      Date: formatDate(c.created_at),
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Comptabilité');
    const nom = (currentProfile && (currentProfile.company_name || currentProfile.full_name)) || 'fournisseur';
    XLSX.writeFile(wb, `comptabilite-${nom}-${new Date().toISOString().slice(0, 10)}.xlsx`);
  });

  document.getElementById('btn-export-pdf').addEventListener('click', () => {
    const rows = comptaFiltered();
    if (!rows.length) { alert("Aucune donnée à exporter."); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const nom = (currentProfile && (currentProfile.company_name || currentProfile.full_name)) || 'Fournisseur';
    const livres = rows.filter(c => c.statut === 'livre');
    const totalMontant = rows.reduce((s, c) => s + (Number(c.montant) || 0), 0);
    doc.setFontSize(14);
    doc.text(`Comptabilité — ${nom}`, 14, 16);
    doc.setFontSize(10);
    doc.text(`${rows.length} colis · ${livres.length} livré(s) · Montant total : ${formatMontant(totalMontant) || '0 FCFA'}`, 14, 24);
    doc.autoTable({
      startY: 30,
      head: [['Colis', 'Destination', 'Statut', 'Montant', 'Date']],
      body: rows.map(c => [
        c.description || '',
        c.destination || '',
        STATUTS[c.statut] ? STATUTS[c.statut].label : c.statut,
        formatMontant(c.montant) || '-',
        formatDate(c.created_at),
      ]),
    });
    doc.save(`comptabilite-${nom}-${new Date().toISOString().slice(0, 10)}.pdf`);
  });

  async function loadColis(){
    const { data, error } = await supabaseClient
      .from('colis')
      .select('*')
      .eq('fournisseur_id', currentUser.id)
      .order('created_at', { ascending: false });

    const list = document.getElementById('colis-list');
    if (error) {
      list.innerHTML = `<div class="empty-state">Erreur de chargement.</div>`;
      return;
    }
    mesColis = data;
    renderColisList();
  }

  function renderRecapStatuts(){
    const box = document.getElementById('recap-statuts');
    if (!mesColis.length) {
      box.innerHTML = `<div class="empty-state">Aucun colis pour le moment.</div>`;
      return;
    }
    const compte = {};
    mesColis.forEach(c => { compte[c.statut] = (compte[c.statut] || 0) + 1; });
    const statutKeys = Object.keys(STATUTS);
    const cols = statutKeys.map(k => `<th>${STATUTS[k].label}</th>`).join('');
    const vals = statutKeys.map(k => `<td>${compte[k] || 0}</td>`).join('');
    box.innerHTML = `
      <table class="recap-table">
        <thead><tr><th>Total</th>${cols}</tr></thead>
        <tbody><tr><td><strong>${mesColis.length}</strong></td>${vals}</tr></tbody>
      </table>
    `;
  }

  function monthKey(iso){
    if (!iso) return '';
    return iso.slice(0, 7);
  }

  function monthLabel(key){
    if (!key) return '';
    const [y, m] = key.split('-');
    const d = new Date(parseInt(y, 10), parseInt(m, 10) - 1, 1);
    return d.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
  }

  function populateMoisSelect(){
    const select = document.getElementById('mois-select');
    const keys = Array.from(new Set(mesColis.map(c => monthKey(c.created_at)))).filter(Boolean).sort((a, b) => b.localeCompare(a));
    const previousValue = select.value;
    select.innerHTML = keys.map(k => `<option value="${k}">${monthLabel(k)}</option>`).join('');
    if (keys.includes(previousValue)) {
      select.value = previousValue;
    } else if (keys.length) {
      select.value = keys[0];
    }
    renderRecapMois();
  }

  function renderRecapMois(){
    const box = document.getElementById('recap-mois');
    const select = document.getElementById('mois-select');
    const selected = select.value;
    if (!selected) {
      box.innerHTML = `<div class="empty-state">Aucun colis pour le moment.</div>`;
      return;
    }
    const colisDuMois = mesColis.filter(c => monthKey(c.created_at) === selected);
    if (!colisDuMois.length) {
      box.innerHTML = `<div class="empty-state">Aucun colis pour ce mois.</div>`;
      return;
    }
    const compte = {};
    colisDuMois.forEach(c => { compte[c.statut] = (compte[c.statut] || 0) + 1; });
    const statutKeys = Object.keys(STATUTS);
    const cols = statutKeys.map(k => `<th>${STATUTS[k].label}</th>`).join('');
    const vals = statutKeys.map(k => `<td>${compte[k] || 0}</td>`).join('');
    const livres = compte['livre'] || 0;
    const taux = colisDuMois.length ? Math.round((livres / colisDuMois.length) * 100) : 0;
    box.innerHTML = `
      <div class="page-sub" style="margin-bottom:14px;">${colisDuMois.length} colis pour ${monthLabel(selected)} · Taux de livraison réussie : ${taux}%</div>
      <table class="recap-table">
        <thead><tr><th>Total</th>${cols}</tr></thead>
        <tbody><tr><td><strong>${colisDuMois.length}</strong></td>${vals}</tr></tbody>
      </table>
    `;
  }

  document.getElementById('mois-select').addEventListener('change', renderRecapMois);

  async function init(){
    const session = await requireAuth();
    if (!session) return;
    currentUser = session.user;

    const profile = await getProfile(currentUser.id);
    if (profile && profile.role === 'equipe') {
      window.location.href = 'equipe.html';
      return;
    }
    if (profile && profile.role === 'livreur') {
      window.location.href = 'livreur.html';
      return;
    }

    // Sécurité : un compte fournisseur pas encore validé (ou refusé) par l'équipe ne doit
    // jamais accéder au tableau de bord, même si une session est restée active pendant l'attente.
    if (!profile || profile.status !== 'valide') {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
      return;
    }

    currentProfile = profile;
    document.getElementById('user-name').textContent = profile ? (profile.company_name || profile.full_name || '') : '';
    document.getElementById('user-first-name').textContent = profile ? (profile.full_name || '') : '';

    addRow();
    loadColis();
    document.getElementById('search-colis').addEventListener('input', (e) => { searchColis = e.target.value; renderColisList(); });

    // Mises à jour en temps réel : tout changement sur mes colis rafraîchit la liste
    supabaseClient
      .channel('colis-fournisseur-' + currentUser.id)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'colis', filter: `fournisseur_id=eq.${currentUser.id}` }, () => {
        loadColis();
      })
      .subscribe();
  }

  document.getElementById('form-change-password').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-change-password');
    const msgBox = document.getElementById('change-pwd-msg');
    const newPassword = document.getElementById('new-password').value;
    const confirmPassword = document.getElementById('new-password-confirm').value;

    if (newPassword !== confirmPassword) {
      msgBox.innerHTML = `<div class="msg msg-error">Les deux mots de passe ne correspondent pas.</div>`;
      return;
    }
    if (newPassword.length < 6) {
      msgBox.innerHTML = `<div class="msg msg-error">Le mot de passe doit contenir au moins 6 caractères.</div>`;
      return;
    }

    btn.disabled = true; btn.textContent = 'Modification...';
    const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
    btn.disabled = false; btn.textContent = 'Changer mon mot de passe';

    if (error) {
      msgBox.innerHTML = `<div class="msg msg-error">Erreur : ${error.message}</div>`;
    } else {
      msgBox.innerHTML = `<div class="msg msg-success">Mot de passe modifié avec succès.</div>`;
      e.target.reset();
    }
  });

  init();
</script>
</body>
</html>
