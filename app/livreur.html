<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace Livreur | Christ Livraison & Transport SARL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="topbar">
  <div class="brand"><div class="logo-mark">CLT</div> Espace Colis — Livreur</div>
  <div class="user-info">
    <span id="user-name"></span>
    <span class="role-pill">Livreur</span>
    <button class="btn-logout" onclick="logout()">Déconnexion</button>
  </div>
</div>

<div class="wrap">
  <div class="page-title">Bonjour <span id="user-first-name"></span> 👋</div>
  <div class="page-sub">Voici les colis qui vous ont été assignés. Mettez à jour leur statut au fur et à mesure de la livraison.</div>

  <div class="card">
    <h2>Mon compte</h2>
    <div id="change-pwd-msg"></div>
    <form id="form-change-password">
      <div class="field-row">
        <div class="field">
          <label>Nouveau mot de passe</label>
          <input type="password" id="new-password" required minlength="6" placeholder="6 caractères minimum">
        </div>
        <div class="field">
          <label>Confirmer le nouveau mot de passe</label>
          <input type="password" id="new-password-confirm" required minlength="6" placeholder="Retapez le mot de passe">
        </div>
      </div>
      <button type="submit" class="btn" id="btn-change-password">Changer mon mot de passe</button>
    </form>
  </div>

  <div class="card">
    <div class="tabs">
      <div class="tab active" id="tab-mes-colis" onclick="showTab('mes')">Mes colis assignés</div>
      <div class="tab" id="tab-tous-colis" onclick="showTab('tous')">Tous les colis</div>
    </div>

    <div id="panel-mes">
      <input type="text" id="search-mes" class="search-input" placeholder="Rechercher par description, destination ou fournisseur...">
      <div class="filters" id="filters-mes"></div>
      <div class="colis-list" id="mes-colis-list">
        <div class="empty-state">Chargement...</div>
      </div>
    </div>

    <div id="panel-tous" class="hidden">
      <input type="text" id="search-tous" class="search-input" placeholder="Rechercher par description, destination ou fournisseur...">
      <div class="filters" id="filters-tous"></div>
      <div class="colis-list" id="tous-colis-list">
        <div class="empty-state">Chargement...</div>
      </div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
  let currentUser = null;
  let allColis = [];
  let profilesById = {};
  let activeFilterMes = 'tous';
  let activeFilterTous = 'tous';
  let activePanel = 'mes';
  let searchMes = '';
  let searchTous = '';

  async function uploadPhoto(file, userId){
    const ext = file.name.split('.').pop();
    const path = `${userId}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const { error } = await supabaseClient.storage.from('colis-photos').upload(path, file);
    if (error) { console.error(error); return null; }
    const { data } = supabaseClient.storage.from('colis-photos').getPublicUrl(path);
    return data.publicUrl;
  }

  function matchesSearch(c, term){
    if (!term) return true;
    const t = term.toLowerCase();
    const desc = (c.description || '').toLowerCase();
    const dest = (c.destination || '').toLowerCase();
    const fourn = fournisseurLabel(c.fournisseur_id).toLowerCase();
    return desc.includes(t) || dest.includes(t) || fourn.includes(t);
  }

  const FILTER_LABELS = { tous: 'Tous', en_attente: 'En attente', recupere: 'Récupéré', en_livraison: 'En livraison', livre: 'Livré', non_livre: 'Non livré', retour: 'Retour' };

  function showTab(which){
    activePanel = which;
    document.getElementById('tab-mes-colis').classList.toggle('active', which === 'mes');
    document.getElementById('tab-tous-colis').classList.toggle('active', which === 'tous');
    document.getElementById('panel-mes').classList.toggle('hidden', which !== 'mes');
    document.getElementById('panel-tous').classList.toggle('hidden', which !== 'tous');
  }

  function renderFilters(containerId, activeFilter, onSelect){
    const box = document.getElementById(containerId);
    box.innerHTML = Object.keys(FILTER_LABELS).map(key =>
      `<div class="filter-chip ${activeFilter===key?'active':''}" data-filter="${key}">${FILTER_LABELS[key]}</div>`
    ).join('');
    box.querySelectorAll('.filter-chip').forEach(chip => {
      chip.addEventListener('click', () => onSelect(chip.dataset.filter));
    });
  }

  function fournisseurLabel(id){
    const p = profilesById[id];
    if (!p) return 'Fournisseur inconnu';
    return p.company_name || p.full_name || id;
  }

  function livreurLabel(id){
    if (!id) return null;
    const p = profilesById[id];
    if (!p) return null;
    return p.full_name || 'Livreur';
  }

  // Ligne éditable pour "Mes colis assignés" (le livreur peut changer le statut)
  function mesColisRowHTML(c){
    const thumb = c.photo_url
      ? `<img src="${c.photo_url}" class="thumb">`
      : `<div class="thumb-placeholder">Pas de photo</div>`;
    const statutOptions = Object.keys(STATUTS).map(k =>
      `<option value="${k}" ${c.statut===k?'selected':''}>${STATUTS[k].label}</option>`).join('');

    return `
      <div class="colis-item" data-id="${c.id}">
        ${thumb}
        <div class="info">
          <div class="desc">${c.description || '(sans description)'}</div>
          <div class="meta">Fournisseur : ${fournisseurLabel(c.fournisseur_id)}${c.destination ? ' · Vers : ' + c.destination : ''}</div>
          <div class="meta">Ajouté le ${formatDate(c.created_at)}</div>
        </div>
        <div class="status-col">
          <select class="status-select">${statutOptions}</select>
          <textarea class="obs-textarea" placeholder="Observation (ex : client absent, numéro injoignable...)">${c.observation ? escapeHTML(c.observation) : ''}</textarea>
          <div class="field" style="margin-top:8px;">
            <label style="font-size:11.5px;">Photo de livraison ${c.photo_livraison_url ? '(déjà ajoutée)' : '(optionnel)'}</label>
            ${c.photo_livraison_url ? `<img src="${c.photo_livraison_url}" class="thumb" style="margin-bottom:6px;">` : ''}
            <input type="file" accept="image/*" class="livraison-photo-input">
          </div>
          <button class="btn btn-sm btn-save" style="margin-top:8px;">Enregistrer</button>
        </div>
      </div>
    `;
  }

  // Ligne en lecture seule pour "Tous les colis"
  function tousColisItemHTML(c){
    const thumb = c.photo_url
      ? `<img src="${c.photo_url}" class="thumb">`
      : `<div class="thumb-placeholder">Pas de photo</div>`;
    const lv = livreurLabel(c.livreur_id);
    return `
      <div class="colis-item">
        ${thumb}
        <div class="info">
          <div class="desc">${c.description || '(sans description)'}</div>
          <div class="meta">Fournisseur : ${fournisseurLabel(c.fournisseur_id)}${c.destination ? ' · Vers : ' + c.destination : ''}</div>
          <div class="meta">Ajouté le ${formatDate(c.created_at)}${lv ? ' · Livreur : ' + lv : ''}</div>
          ${c.observation ? `<div class="obs-display"><strong>Observation :</strong> ${escapeHTML(c.observation)}</div>` : ''}
          ${c.photo_livraison_url ? `<div class="meta">Preuve de livraison : <img src="${c.photo_livraison_url}" class="thumb" style="vertical-align:middle; margin-left:6px;"></div>` : ''}
        </div>
        <div class="status-col">${statutBadgeHTML(c.statut)}</div>
      </div>
    `;
  }

  function renderMesColis(){
    const list = document.getElementById('mes-colis-list');
    const mine = allColis.filter(c => c.livreur_id === currentUser.id);
    let filtered = activeFilterMes === 'tous' ? mine : mine.filter(c => c.statut === activeFilterMes);
    filtered = filtered.filter(c => matchesSearch(c, searchMes));
    if (!filtered.length) {
      list.innerHTML = `<div class="empty-state">Aucun colis assigné${activeFilterMes !== 'tous' || searchMes ? ' pour ces critères' : ''}.</div>`;
      return;
    }
    list.innerHTML = filtered.map(mesColisRowHTML).join('');

    list.querySelectorAll('.btn-save').forEach(btn => {
      btn.addEventListener('click', async () => {
        const item = btn.closest('.colis-item');
        const id = item.dataset.id;
        const statut = item.querySelector('.status-select').value;
        const observation = item.querySelector('.obs-textarea').value.trim() || null;
        const photoInput = item.querySelector('.livraison-photo-input');
        const existing = allColis.find(c => c.id === id);
        let photo_livraison_url = existing ? existing.photo_livraison_url : null;

        if (photoInput.files && photoInput.files[0]) {
          btn.disabled = true; btn.textContent = 'Envoi photo...';
          const uploaded = await uploadPhoto(photoInput.files[0], currentUser.id);
          if (uploaded) {
            photo_livraison_url = uploaded;
          } else {
            alert("L'envoi de la photo a échoué. Le colis sera enregistré sans la nouvelle photo. Vérifiez votre connexion et réessayez.");
          }
        }

        btn.disabled = true; btn.textContent = '...';
        const { error } = await supabaseClient.from('colis').update({ statut, observation, photo_livraison_url }).eq('id', id);
        btn.disabled = false; btn.textContent = 'Enregistrer';
        if (error) { alert("Erreur : " + error.message); }
      });
    });
  }

  function renderTousColis(){
    const list = document.getElementById('tous-colis-list');
    let filtered = activeFilterTous === 'tous' ? allColis : allColis.filter(c => c.statut === activeFilterTous);
    filtered = filtered.filter(c => matchesSearch(c, searchTous));
    if (!filtered.length) {
      list.innerHTML = `<div class="empty-state">Aucun colis${activeFilterTous !== 'tous' || searchTous ? ' pour ces critères' : ''}.</div>`;
      return;
    }
    list.innerHTML = filtered.map(tousColisItemHTML).join('');
  }

  function renderAll(){
    renderMesColis();
    renderTousColis();
  }

  async function loadProfiles(){
    const { data, error } = await supabaseClient
      .from('profiles')
      .select('id, full_name, company_name, role');
    if (error) { console.error(error); return; }
    profilesById = {};
    data.forEach(p => { profilesById[p.id] = p; });
  }

  async function loadColis(){
    const { data, error } = await supabaseClient
      .from('colis')
      .select('*')
      .order('created_at', { ascending: false });
    if (error) { console.error(error); return; }
    allColis = data;
    renderAll();
  }

  async function init(){
    const session = await requireAuth();
    if (!session) return;
    currentUser = session.user;

    const profile = await getProfile(currentUser.id);
    if (!profile || profile.role !== 'livreur') {
      if (profile && profile.role === 'equipe') {
        window.location.href = 'equipe.html';
      } else {
        window.location.href = 'fournisseur.html';
      }
      return;
    }

    document.getElementById('user-name').textContent = profile.full_name || '';
    document.getElementById('user-first-name').textContent = profile.full_name || '';

    function selectFilterMes(val){ activeFilterMes = val; renderFilters('filters-mes', activeFilterMes, selectFilterMes); renderMesColis(); }
    function selectFilterTous(val){ activeFilterTous = val; renderFilters('filters-tous', activeFilterTous, selectFilterTous); renderTousColis(); }
    renderFilters('filters-mes', activeFilterMes, selectFilterMes);
    renderFilters('filters-tous', activeFilterTous, selectFilterTous);

    document.getElementById('search-mes').addEventListener('input', (e) => { searchMes = e.target.value; renderMesColis(); });
    document.getElementById('search-tous').addEventListener('input', (e) => { searchTous = e.target.value; renderTousColis(); });

    await loadProfiles();
    await loadColis();

    // Mises à jour en temps réel sur tous les colis
    supabaseClient
      .channel('colis-livreur-' + currentUser.id)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'colis' }, () => {
        loadColis();
      })
      .subscribe();
  }

  document.getElementById('form-change-password').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-change-password');
    const msgBox = document.getElementById('change-pwd-msg');
    const newPassword = document.getElementById('new-password').value;
    const confirmPassword = document.getElementById('new-password-confirm').value;

    if (newPassword !== confirmPassword) {
      msgBox.innerHTML = `<div class="msg msg-error">Les deux mots de passe ne correspondent pas.</div>`;
      return;
    }
    if (newPassword.length < 6) {
      msgBox.innerHTML = `<div class="msg msg-error">Le mot de passe doit contenir au moins 6 caractères.</div>`;
      return;
    }

    btn.disabled = true; btn.textContent = 'Modification...';
    const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
    btn.disabled = false; btn.textContent = 'Changer mon mot de passe';

    if (error) {
      msgBox.innerHTML = `<div class="msg msg-error">Erreur : ${error.message}</div>`;
    } else {
      msgBox.innerHTML = `<div class="msg msg-success">Mot de passe modifié avec succès.</div>`;
      e.target.reset();
    }
  });

  init();
</script>
</body>
</html>
