<script>
  let currentUser = null;
  let allColis = [];
  let profilesById = {};

  // Pagination réelle : la première page se charge immédiatement, puis "Charger plus" permet
  // de remonter tout l'historique par blocs successifs (voir aussi équipe.html et fournisseur.html).
  const COLIS_PAGE_SIZE = 500;
  let colisOffset = 0;
  let colisHasMore = true;
  let colisLoadingMore = false;

  // Ferme proprement l'abonnement temps réel à la fermeture/déconnexion de la page (voir aussi
  // équipe.html et fournisseur.html, qui appliquent le même principe).
  const __realtimeChannels = [];
  function trackChannel(channel){ __realtimeChannels.push(channel); return channel; }
  window.addEventListener('beforeunload', () => {
    __realtimeChannels.forEach(ch => supabaseClient.removeChannel(ch));
  });
  let activeFilterMes = 'tous';
  let activeFilterTous = 'tous';
  let activePanel = 'mes';
  let searchMes = '';
  let searchTous = '';
  let filtreDateMes = '';
  let filtreDateTous = '';

  function closeOtherSections(exceptContentId){
    document.querySelectorAll('.card > .collapsible-content').forEach(c => {
      if (c.id === exceptContentId) return;
      if (c.classList.contains('open')){
        collapseCollapsible(c);
        const h = c.previousElementSibling;
        const arr = h && h.querySelector('.collapse-arrow');
        if (arr) arr.textContent = '▶';
      }
    });
  }

  function toggleSection(header, contentId){
    const content = document.getElementById(contentId);
    const willOpen = !content.classList.contains('open');
    if (willOpen) closeOtherSections(contentId);
    if (willOpen) { expandCollapsible(content); } else { collapseCollapsible(content); }
    const arrow = header.querySelector('.collapse-arrow');
    if (arrow) arrow.textContent = willOpen ? '▼' : '▶';
  }

  // Scroll-spy : met en surbrillance douce le lien du menu correspondant à la section visible,
  // et ouvre automatiquement une section repliable + fait un léger flash sur son titre lors d'un clic.
  (function initSubnavScrollSpy(){
    const links = Array.from(document.querySelectorAll('.subnav a'));
    if (!links.length) return;
    const sections = links.map(a => document.querySelector(a.getAttribute('href'))).filter(Boolean);
    if (!sections.length) return;

    let suppressUntil = 0;

    const setActive = (id) => {
      links.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + id));
    };

    const observer = new IntersectionObserver((entries) => {
      if (Date.now() < suppressUntil) return;
      const visible = entries.filter(e => e.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio);
      if (visible.length) setActive(visible[0].target.id);
    }, { rootMargin: '-72px 0px -60% 0px', threshold: [0, 0.1, 0.25, 0.5] });

    sections.forEach(s => observer.observe(s));

    links.forEach(a => {
      a.addEventListener('click', () => {
        const id = a.getAttribute('href').slice(1);
        const section = document.getElementById(id);
        if (!section) return;

        // Fixe immédiatement l'onglet actif sur la section cliquée, et ignore
        // temporairement le scroll-spy le temps que le saut d'ancre et l'animation
        // d'ouverture se terminent (sinon l'onglet en surbrillance peut sauter sur
        // la section voisine pendant la transition).
        setActive(id);
        suppressUntil = Date.now() + 900;

        const header = section.querySelector('.collapsible-header');
        if (header) {
          const content = header.nextElementSibling;
          if (content && !content.classList.contains('open')) header.click();
        }

        const title = section.querySelector('.panel-subtitle, h2, h3');
        if (title) {
          title.classList.remove('section-flash-title');
          void title.offsetWidth;
          title.classList.add('section-flash-title');
        }
      });
    });
  })();

  async function uploadPhoto(file, userId, onProgress){
    const ext = file.name.split('.').pop();
    const path = `${userId}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;

    // Sans callback de progression (ex : synchronisation hors-ligne en tâche de fond), on
    // garde l'envoi simple via le SDK Supabase.
    if (typeof onProgress !== 'function') {
      const { error } = await supabaseClient.storage.from('colis-photos').upload(path, file);
      if (error) { console.error(error); return null; }
      const { data } = supabaseClient.storage.from('colis-photos').getPublicUrl(path);
      return data.publicUrl;
    }

    // Avec callback de progression (envoi déclenché par le livreur) : on passe par XHR, seule
    // API permettant de suivre la progression réelle de l'envoi (utile sur réseau lent/mobile).
    return new Promise(async (resolve) => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const token = session ? session.access_token : SUPABASE_KEY;
      const xhr = new XMLHttpRequest();
      xhr.open('POST', `${SUPABASE_URL}/storage/v1/object/colis-photos/${path}`);
      xhr.setRequestHeader('Authorization', `Bearer ${token}`);
      xhr.setRequestHeader('apikey', SUPABASE_KEY);
      xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) onProgress(Math.round((e.loaded / e.total) * 100));
      };
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          const { data } = supabaseClient.storage.from('colis-photos').getPublicUrl(path);
          resolve(data.publicUrl);
        } else {
          console.error("Échec de l'envoi de la photo :", xhr.status, xhr.responseText);
          resolve(null);
        }
      };
      xhr.onerror = () => resolve(null);
      xhr.send(file);
    });
  }

  // ---------- File d'attente hors-ligne pour les mises à jour de statut ----------
  // Les livreurs travaillent souvent dans des zones peu couvertes par le réseau.
  // Plutôt que de perdre une mise à jour de statut en cas de coupure (ou de simplement
  // afficher une alerte que le livreur risque d'oublier), on la stocke localement (IndexedDB)
  // et on la synchronise automatiquement dès que la connexion revient.
  const OFFLINE_DB_NAME = 'livreur-offline-queue';
  const OFFLINE_STORE = 'updates';
  let pendingSyncIds = new Set();
  let syncInProgress = false;

  function openQueueDB(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(OFFLINE_DB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(OFFLINE_STORE)) {
          db.createObjectStore(OFFLINE_STORE, { keyPath: 'key', autoIncrement: true });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function queueAdd(entry){
    const db = await openQueueDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(OFFLINE_STORE, 'readwrite');
      tx.objectStore(OFFLINE_STORE).add(entry);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function queueGetAll(){
    const db = await openQueueDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(OFFLINE_STORE, 'readonly');
      const req = tx.objectStore(OFFLINE_STORE).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function queueDelete(key){
    const db = await openQueueDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(OFFLINE_STORE, 'readwrite');
      tx.objectStore(OFFLINE_STORE).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function refreshOfflineBanner(){
    let entries = [];
    try { entries = await queueGetAll(); } catch(e) { console.error(e); }
    pendingSyncIds = new Set(entries.map(e => e.colisId));
    const banner = document.getElementById('offline-queue-banner');
    const text = document.getElementById('offline-queue-text');
    if (banner && text) {
      if (entries.length === 0) {
        banner.classList.add('hidden');
      } else {
        banner.classList.remove('hidden');
        const label = navigator.onLine ? 'synchronisation en cours...' : 'en attente de connexion';
        text.textContent = `📶 ${entries.length} mise${entries.length > 1 ? 's' : ''} à jour en attente (${label})`;
      }
    }
    renderAll();
  }

  async function flushOfflineQueue(){
    if (syncInProgress || !navigator.onLine) return;
    syncInProgress = true;
    try {
      const entries = await queueGetAll();
      for (const entry of entries) {
        let photo_livraison_url = entry.photo_livraison_url;
        if (entry.photoBlob) {
          const uploaded = await uploadPhoto(entry.photoBlob, entry.userId);
          if (!uploaded) break; // toujours hors-ligne ou échec réseau : on réessaiera plus tard
          photo_livraison_url = uploaded;
        }
        const { error } = await supabaseClient.from('colis')
          .update({ statut: entry.statut, observation: entry.observation, photo_livraison_url })
          .eq('id', entry.colisId);
        if (error) break; // échec réseau probable : on réessaiera plus tard
        await queueDelete(entry.key);
        const idx = allColis.findIndex(c => c.id === entry.colisId);
        if (idx !== -1) Object.assign(allColis[idx], { statut: entry.statut, observation: entry.observation, photo_livraison_url });
      }
    } catch (e) {
      console.error('Synchronisation hors-ligne :', e);
    } finally {
      syncInProgress = false;
      await refreshOfflineBanner();
    }
  }

  function matchesSearch(c, term){
    if (!term) return true;
    const t = term.toLowerCase();
    const desc = (c.description || '').toLowerCase();
    const dest = (c.destination || '').toLowerCase();
    const fourn = fournisseurLabel(c.fournisseur_id).toLowerCase();
    return desc.includes(t) || dest.includes(t) || fourn.includes(t);
  }

  function matchesDate(c, dateStr){
    if (!dateStr) return true;
    return dayKey(c.created_at) === dateStr;
  }

  function todayLocalISODate(){
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  const FILTER_LABELS = { tous: 'Tous', en_attente: 'En attente', recupere: 'Récupéré', en_livraison: 'En livraison', livre: 'Livré', non_livre: 'Non livré', retour: 'Retour' };

  function showTab(which){
    activePanel = which;
    document.getElementById('tab-mes-colis').classList.toggle('active', which === 'mes');
    document.getElementById('tab-tous-colis').classList.toggle('active', which === 'tous');
    document.getElementById('panel-mes').classList.toggle('hidden', which !== 'mes');
    document.getElementById('panel-tous').classList.toggle('hidden', which !== 'tous');
  }

  function renderFilters(containerId, activeFilter, onSelect){
    const box = document.getElementById(containerId);
    box.innerHTML = Object.keys(FILTER_LABELS).map(key =>
      `<div class="filter-chip ${activeFilter===key?'active':''}" data-filter="${key}">${FILTER_LABELS[key]}</div>`
    ).join('');
    box.querySelectorAll('.filter-chip').forEach(chip => {
      chip.addEventListener('click', () => onSelect(chip.dataset.filter));
    });
  }

  function fournisseurLabel(id){
    const p = profilesById[id];
    if (!p) return 'Client inconnu';
    return escapeHTML(p.company_name || p.full_name || id);
  }

  function livreurLabel(id){
    if (!id) return null;
    const p = profilesById[id];
    if (!p) return null;
    return p.full_name || 'Livreur';
  }

  // Ligne éditable pour "Mes colis assignés" (le livreur peut changer le statut)
  function mesColisRowHTML(c){
    const thumb = c.photo_url
      ? `<img src="${c.photo_url}" class="thumb" alt="Photo du colis${c.description ? ' : ' + escapeHTML(c.description) : ''}">`
      : `<div class="thumb-placeholder">Pas de photo</div>`;
    const statutOptions = Object.keys(STATUTS).map(k =>
      `<option value="${k}" ${c.statut===k?'selected':''}>${STATUTS[k].label}</option>`).join('');

    return `
      <div class="colis-item" data-id="${c.id}" data-numero="${escapeHTML(c.numero || '')}">
        ${thumb}
        <div class="info">
          ${c.numero ? `<div class="meta tracking-numero"><strong>N° de suivi :</strong> ${escapeHTML(c.numero)}</div>` : ''}
          <div class="desc">${c.description ? escapeHTML(c.description) : '(sans description)'}</div>
          <div class="meta">Client : ${fournisseurLabel(c.fournisseur_id)}${c.destination ? ' · Vers : ' + escapeHTML(c.destination) : ''}</div>
          ${c.commune_recuperation ? `<div class="meta" style="color:var(--accent, #E26313); font-weight:600;">📍 Récupération : ${escapeHTML(c.commune_recuperation)}${c.adresse_recuperation ? ' — ' + escapeHTML(c.adresse_recuperation) : ''}</div>` : ''}
          <div class="meta">Ajouté le ${formatDate(c.created_at)}</div>
          <button type="button" class="btn btn-outline btn-sm btn-copy-tracking" style="margin-top:6px;">🔗 Copier le lien de suivi</button>
        </div>
        <div class="status-col">
          ${pendingSyncIds.has(c.id) ? `<div class="sync-pending-badge">⏳ En attente de synchronisation</div>` : ''}
          <select class="status-select">${statutOptions}</select>
          <textarea class="obs-textarea" placeholder="Observation (ex : client absent, numéro injoignable...)">${c.observation ? escapeHTML(c.observation) : ''}</textarea>
          <div class="field" style="margin-top:8px;">
            <label style="font-size:11.5px;">Photo de livraison ${c.photo_livraison_url ? '(déjà ajoutée — choisissez une photo pour la remplacer)' : '(optionnel)'}</label>
            ${c.photo_livraison_url ? `<img src="${c.photo_livraison_url}" class="thumb" style="margin-bottom:6px;" alt="Photo de preuve de livraison déjà ajoutée">` : ''}
            <div class="photo-pick-group livraison-photo-input">
              <div class="avatar-upload-btns">
                <label class="btn btn-outline btn-sm" style="cursor:pointer;">📷 Prendre une photo<input type="file" accept="image/*" capture="user" class="hidden pick-camera"></label>
                <label class="btn btn-outline btn-sm" style="cursor:pointer;">🖼️ Bibliothèque<input type="file" accept="image/*" class="hidden pick-library"></label>
              </div>
              <div class="photo-pick-filename"></div>
            </div>
          </div>
          <button class="btn btn-sm btn-save" style="margin-top:8px;">Enregistrer</button>
        </div>
      </div>
    `;
  }

  // Ligne en lecture seule pour "Tous les colis"
  function tousColisItemHTML(c){

      ? `<img src="${c.photo_url}" class="thumb" alt="Photo du colis${c.description ? ' : ' + escapeHTML(c.description) : ''}">`
      : `<div class="thumb-placeholder">Pas de photo</div>`;
    const livreurProfile = c.livreur_id ? profilesById[c.livreur_id] : null;
    const livreurLine = livreurProfile
      ? `<div class="livreur-meta">${avatarHTML(livreurProfile, 20)} <span>Livreur : ${escapeHTML(livreurProfile.full_name || 'Livreur')}</span></div>`
      : '';
    return `
      <div class="colis-item" data-id="${c.id}" data-numero="${escapeHTML(c.numero || '')}">
        ${thumb}
        <div class="info">
          ${c.numero ? `<div class="meta tracking-numero"><strong>N° de suivi :</strong> ${escapeHTML(c.numero)}</div>` : ''}
          <div class="desc">${c.description ? escapeHTML(c.description) : '(sans description)'}</div>
          <div class="meta">Client : ${fournisseurLabel(c.fournisseur_id)}${c.destination ? ' · Vers : ' + escapeHTML(c.destination) : ''}</div>
          ${c.commune_recuperation ? `<div class="meta" style="color:var(--accent, #E26313); font-weight:600;">📍 Récupération : ${escapeHTML(c.commune_recuperation)}${c.adresse_recuperation ? ' — ' + escapeHTML(c.adresse_recuperation) : ''}</div>` : ''}
          <div class="meta">Ajouté le ${formatDate(c.created_at)}</div>

    `;
  }

  // Bouton d'action groupée "Récupérer tout" : affiché uniquement pour le groupe du jour même
  // et seulement s'il reste au moins un colis "en attente" chez cette vendeuse.
  function recupererToutActionHTML(day, client){
    if (day.key !== todayLocalISODate()) return '';
    const pending = client.items.filter(c => c.statut === 'en_attente');
    if (!pending.length) return '';
    return ` <button type="button" class="btn btn-sm btn-recuperer-tout" data-fournisseur="${client.key}" data-day="${day.key}" style="margin-left:8px;">📦 Récupérer tout (${pending.length})</button>`;
  }

  function renderMesColis(){
    const list = document.getElementById('mes-colis-list');
    const __anchor = captureScrollAnchor(list);
    const mine = allColis.filter(c => c.livreur_id === currentUser.id);
    let filtered = activeFilterMes === 'tous' ? mine : mine.filter(c => c.statut === activeFilterMes);
    filtered = filtered.filter(c => matchesSearch(c, searchMes) && matchesDate(c, filtreDateMes));
    if (!filtered.length) {
      list.innerHTML = filtreDateMes
        ? `<div class="empty-state">Aucun colis assigné à cette date.</div>`
        : `<div class="empty-state">Aucun colis assigné${activeFilterMes !== 'tous' || searchMes ? ' pour ces critères' : ''}.</div>`;
      restoreScrollAnchor(list, __anchor);
      return;
    }
    const groupsMes = groupColisByDayAndClient(filtered, c => c.fournisseur_id, c => fournisseurLabel(c.fournisseur_id));
    list.innerHTML = renderGroupedColisHTML(groupsMes, mesColisRowHTML, recupererToutActionHTML);

    list.querySelectorAll('.btn-recuperer-tout').forEach(btn => {
      btn.addEventListener('click', async () => {
        const fournisseurId = btn.dataset.fournisseur;
        const dayKeyVal = btn.dataset.day;
        const ids = mine
          .filter(c => (c.fournisseur_id || "?") === fournisseurId && c.statut === 'en_attente' && dayKey(c.created_at) === dayKeyVal)
          .map(c => c.id);
        if (!ids.length) return;
        if (!confirm(`Marquer les ${ids.length} colis du jour de cette vendeuse comme récupérés ?`)) return;
        const originalLabel = btn.textContent;
        btn.disabled = true; btn.textContent = 'Récupération...';

        if (!navigator.onLine) {
          for (const id of ids) {
            const existing = allColis.find(c => c.id === id);
            try {
              await queueAdd({ colisId: id, statut: 'recupere', observation: existing ? existing.observation : null, photo_livraison_url: existing ? existing.photo_livraison_url : null, photoBlob: null, userId: currentUser.id, timestamp: Date.now() });
            } catch (e) { console.error(e); }
            if (existing) existing.statut = 'recupere';
          }
          await refreshOfflineBanner();
          renderAll();
          return;
        }

        const { error } = await supabaseClient.from('colis').update({ statut: 'recupere' }).in('id', ids);
        if (error) {
          alert("Erreur : " + error.message);
          btn.disabled = false; btn.textContent = originalLabel;
          return;
        }
        ids.forEach(id => {
          const idx = allColis.findIndex(c => c.id === id);
          if (idx !== -1) allColis[idx].statut = 'recupere';
        });
        renderAll();
      });
    });

    list.querySelectorAll('.btn-save').forEach(btn => {
      btn.addEventListener('click', async () => {
        const item = btn.closest('.colis-item');
        const id = item.dataset.id;
        const statut = item.querySelector('.status-select').value;
        const observation = item.querySelector('.obs-textarea').value.trim() || null;
        const pickedPhoto = pickedGroupFile(item.querySelector('.livraison-photo-input'));
        const existing = allColis.find(c => c.id === id);
        let photo_livraison_url = existing ? existing.photo_livraison_url : null;

        // Hors connexion : on met la mise à jour en file d'attente au lieu de la perdre.
        if (!navigator.onLine) {
          btn.disabled = true; btn.textContent = 'Enregistrement...';
          try {
            await queueAdd({ colisId: id, statut, observation, photo_livraison_url, photoBlob: pickedPhoto || null, userId: currentUser.id, timestamp: Date.now() });
          } catch (e) { console.error(e); }
          if (existing) Object.assign(existing, { statut, observation });
          btn.disabled = false; btn.textContent = 'Enregistrer';
          await refreshOfflineBanner();
          return;
        }

        if (pickedPhoto) {
          btn.disabled = true; btn.textContent = 'Envoi photo... 0%';
          const uploaded = await uploadPhoto(pickedPhoto, currentUser.id, (pct) => {
            btn.textContent = `Envoi photo... ${pct}%`;
          });
          if (uploaded) {
            photo_livraison_url = uploaded;
          } else {
            // Échec probable de connexion pendant l'envoi de la photo : on met tout en file d'attente.
            btn.disabled = true; btn.textContent = 'Enregistrement...';
            try {
              await queueAdd({ colisId: id, statut, observation, photo_livraison_url: existing ? existing.photo_livraison_url : null, photoBlob: pickedPhoto, userId: currentUser.id, timestamp: Date.now() });
            } catch (e) { console.error(e); }
            if (existing) Object.assign(existing, { statut, observation });
            btn.disabled = false; btn.textContent = 'Enregistrer';
            await refreshOfflineBanner();
            return;
          }
        }

        btn.disabled = true; btn.textContent = '...';
        const { error } = await supabaseClient.from('colis').update({ statut, observation, photo_livraison_url }).eq('id', id);
        btn.disabled = false; btn.textContent = 'Enregistrer';
        if (error) {
          // Échec réseau probable : on met la mise à jour en file d'attente plutôt que de la perdre.
          try {
            await queueAdd({ colisId: id, statut, observation, photo_livraison_url, photoBlob: null, userId: currentUser.id, timestamp: Date.now() });
          } catch (e) { console.error(e); }
          if (existing) Object.assign(existing, { statut, observation, photo_livraison_url });
          await refreshOfflineBanner();
          return;
        }
        // Mise à jour immédiate de l'état local + réaffichage, sans attendre l'aller-retour du temps réel.
        const idx = allColis.findIndex(c => c.id === id);
        if (idx !== -1) Object.assign(allColis[idx], { statut, observation, photo_livraison_url });
        renderAll();
      });
    });
    restoreScrollAnchor(list, __anchor);
  }

  function renderTousColis(){
    const list = document.getElementById('tous-colis-list');
    const __anchor = captureScrollAnchor(list);
    let filtered = activeFilterTous === 'tous' ? allColis : allColis.filter(c => c.statut === activeFilterTous);
    filtered = filtered.filter(c => matchesSearch(c, searchTous) && matchesDate(c, filtreDateTous));
    if (!filtered.length) {
      list.innerHTML = filtreDateTous
        ? `<div class="empty-state">Aucun colis à cette date.</div>`
        : `<div class="empty-state">Aucun colis${activeFilterTous !== 'tous' || searchTous ? ' pour ces critères' : ''}.</div>`;
      appendColisLoadMore(list);
      restoreScrollAnchor(list, __anchor);
      return;
    }
    const groupsTous = groupColisByDayAndClient(filtered, c => c.fournisseur_id, c => fournisseurLabel(c.fournisseur_id));
    list.innerHTML = renderGroupedColisHTML(groupsTous, tousColisItemHTML);
    appendColisLoadMore(list);
    restoreScrollAnchor(list, __anchor);
  }

  // Ajoute, si nécessaire, le bouton "Charger plus" en bas de la liste "Tous les colis".
  function appendColisLoadMore(list){
    if (!colisHasMore) return;
    list.insertAdjacentHTML('beforeend', `
      <div class="load-more-row" style="text-align:center; padding:12px 0;">
        <div style="font-size:13px; color:var(--muted); margin-bottom:8px;">Historique partiel : d'autres colis plus anciens restent à charger.</div>
        <button type="button" class="btn btn-outline btn-sm" id="btn-load-more-colis" ${colisLoadingMore ? 'disabled' : ''}>${colisLoadingMore ? 'Chargement…' : 'Charger plus de colis'}</button>
      </div>`);
    const btnLoadMoreColis = document.getElementById('btn-load-more-colis');
    if (btnLoadMoreColis) btnLoadMoreColis.addEventListener('click', loadMoreColis);
  }

  function renderAll(){
    renderMesColis();
    renderTousColis();
  }

  async function loadProfiles(){
    const { data, error } = await supabaseClient
      .from('profiles')
      .select('id, full_name, company_name, role, avatar_url');
    if (error) { console.error(error); return; }
    profilesById = {};
    data.forEach(p => { profilesById[p.id] = p; });
  }

  // Charge la première page de colis (les plus récents). Le livreur voit l'ensemble des colis
  // (choix intentionnel de l'équipe) ; tant que l'historique complet n'a pas été rapatrié via
  // "Charger plus", les listes "Mes colis" et "Tous les colis" ne portent que sur ce sous-ensemble.
  async function loadColis(){
    colisOffset = 0;
    colisHasMore = true;
    const { data, error } = await supabaseClient
      .from('colis')
      .select('*')
      .order('created_at', { ascending: false })
      .range(0, COLIS_PAGE_SIZE - 1);
    if (error) { console.error(error); return; }
    allColis = data;
    colisOffset = data.length;
    colisHasMore = data.length === COLIS_PAGE_SIZE;
    renderAll();
  }

  async function loadMoreColis(){
    if (colisLoadingMore || !colisHasMore) return;
    colisLoadingMore = true;
    renderAll();
    const { data, error } = await supabaseClient
      .from('colis')
      .select('*')
      .order('created_at', { ascending: false })
      .range(colisOffset, colisOffset + COLIS_PAGE_SIZE - 1);
    colisLoadingMore = false;
    if (error) { console.error(error); renderAll(); return; }
    allColis = allColis.concat(data);
    colisOffset += data.length;
    colisHasMore = data.length === COLIS_PAGE_SIZE;
    renderAll();
  }

  async function init(){
    const session = await requireAuth();
    if (!session) return;
    currentUser = session.user;

    const profile = await getProfile(currentUser.id);
    if (!profile || profile.role !== 'livreur') {
      if (profile && profile.role === 'equipe') {
        window.location.href = 'equipe.html';
      } else {
        window.location.href = 'fournisseur.html';
      }
      return;
    }

    // Sécurité : un compte pas encore validé (ou refusé) ne doit jamais accéder au tableau de bord.
    if (profile.status !== 'valide') {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
      return;
    }

    document.getElementById('user-name').textContent = profile.full_name || '';
    document.getElementById('user-first-name').textContent = profile.full_name || '';
    initAvatarUpload({ profile, previewContainerId: 'avatar-preview', topbarContainerId: 'user-avatar-topbar', cameraInputId: 'avatar-input-camera', libraryInputId: 'avatar-input-library', statusId: 'avatar-msg' });
    initProfileInfoForm({ profile, formId: 'form-profile-info', fullNameId: 'profile-full-name', msgId: 'profile-info-msg', primaryNameDisplayId: 'user-name', secondaryNameDisplayId: 'user-first-name' });
    initPhoneChangeForm({ profile, currentPhoneId: 'phone-current', newPhoneId: 'phone-new', otpRowId: 'phone-otp-row', otpCodeId: 'phone-otp-code', sendBtnId: 'btn-send-phone-otp', confirmBtnId: 'btn-confirm-phone-otp', cancelBtnId: 'btn-cancel-phone-otp', msgId: 'phone-change-msg' });
    initSettingsMenu();
    // Protégé par try/catch : une erreur de présence ne doit jamais bloquer le reste du tableau de bord.
    try { initPresence(profile); } catch (e) { console.error('Erreur initialisation présence', e); }

    function selectFilterMes(val){ activeFilterMes = val; renderFilters('filters-mes', activeFilterMes, selectFilterMes); renderMesColis(); }
    function selectFilterTous(val){ activeFilterTous = val; renderFilters('filters-tous', activeFilterTous, selectFilterTous); renderTousColis(); }
    renderFilters('filters-mes', activeFilterMes, selectFilterMes);
    renderFilters('filters-tous', activeFilterTous, selectFilterTous);

    // Recherche avec anti-rebond (debounce) : évite de redessiner la liste à chaque frappe,
    // ce qui est surtout sensible sur mobile avec une longue liste de colis.
    let searchMesTimer = null;
    let searchTousTimer = null;
    document.getElementById('search-mes').addEventListener('input', (e) => {
      const val = e.target.value;
      clearTimeout(searchMesTimer);
      searchMesTimer = setTimeout(() => { searchMes = val; renderMesColis(); }, 350);
    });
    document.getElementById('search-tous').addEventListener('input', (e) => {
      const val = e.target.value;
      clearTimeout(searchTousTimer);
      searchTousTimer = setTimeout(() => { searchTous = val; renderTousColis(); }, 350);
    });

    filtreDateMes = todayLocalISODate();
    document.getElementById('filtre-date-mes').value = filtreDateMes;
    document.getElementById('filtre-date-mes').addEventListener('change', (e) => { filtreDateMes = e.target.value; renderMesColis(); });
    document.getElementById('btn-toutes-dates-mes').addEventListener('click', () => {
      filtreDateMes = '';
      document.getElementById('filtre-date-mes').value = '';
      renderMesColis();
    });

    filtreDateTous = todayLocalISODate();
    document.getElementById('filtre-date-tous').value = filtreDateTous;
    document.getElementById('filtre-date-tous').addEventListener('change', (e) => { filtreDateTous = e.target.value; renderTousColis(); });
    document.getElementById('btn-toutes-dates-tous').addEventListener('click', () => {
      filtreDateTous = '';
      document.getElementById('filtre-date-tous').value = '';
      renderTousColis();
    });

    await loadProfiles();
    await loadColis();
    await refreshOfflineBanner();
    flushOfflineQueue();

    // Mises à jour en temps réel sur tous les colis
    trackChannel(supabaseClient
      .channel('colis-livreur-' + currentUser.id)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'colis' }, () => {
        loadColis();
      })
      .subscribe());
  }

  document.getElementById('form-change-password').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-change-password');
    const msgBox = document.getElementById('change-pwd-msg');
    const newPassword = document.getElementById('new-password').value;
    const confirmPassword = document.getElementById('new-password-confirm').value;

    if (newPassword !== confirmPassword) {
      msgBox.innerHTML = `<div class="msg msg-error">Les deux mots de passe ne correspondent pas.</div>`;
      return;
    }
    if (newPassword.length < 6) {
      msgBox.innerHTML = `<div class="msg msg-error">Le mot de passe doit contenir au moins 6 caractères.</div>`;
      return;
    }

    btn.disabled = true; btn.textContent = 'Modification...';
    const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
    btn.disabled = false; btn.textContent = 'Changer mon mot de passe';

    if (error) {
      msgBox.innerHTML = `<div class="msg msg-error">Erreur : ${error.message}</div>`;
    } else {
      msgBox.innerHTML = `<div class="msg msg-success">Mot de passe modifié avec succès.</div>`;
      e.target.reset();
    }
  });

  document.getElementById('btn-sync-now').addEventListener('click', () => { flushOfflineQueue(); });
  window.addEventListener('online', () => { flushOfflineQueue(); });
  window.addEventListener('offline', () => { refreshOfflineBanner(); });
  setInterval(() => { if (navigator.onLine) flushOfflineQueue(); }, 20000);

  init();
</script>
</body>
</html>
