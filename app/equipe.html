<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord Équipe | Christ Livraison & Transport SARL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="topbar">
  <div class="brand"><div class="logo-mark">CLT</div> Tableau de bord — Équipe</div>
  <div class="user-info">
    <span id="user-name"></span>
    <span class="role-pill">Équipe interne</span>
    <button class="btn-logout" onclick="logout()">Déconnexion</button>
  </div>
</div>

<div class="wrap">
  <div class="page-title">Suivi des colis</div>
  <div class="page-sub">Tous les colis enregistrés par les fournisseurs, en temps réel.</div>

  <div class="card">
    <h2>Ajouter un colis pour un fournisseur</h2>
    <div id="add-msg"></div>
    <form id="form-add-colis">
      <div class="field-row">
        <div class="field">
          <label>Fournisseur</label>
          <select id="add-fournisseur" required>
            <option value="">— Sélectionner —</option>
          </select>
        </div>
        <div class="field">
          <label>Destination</label>
          <input type="text" id="add-dest" placeholder="Ex : Cocody, Angré">
        </div>
      </div>
      <div class="field">
        <label>Description du colis</label>
        <textarea id="add-desc" placeholder="Ex : Carton de vêtements, 5kg" required></textarea>
      </div>
      <div class="field">
        <label>Photo (optionnel)</label>
        <input type="file" id="add-photo" accept="image/*">
      </div>
      <button type="submit" class="btn" id="btn-submit-colis">Ajouter le colis</button>
    </form>
  </div>

  <div class="card">
    <h2>Tous les colis</h2>
    <div class="filters" id="filters"></div>
    <div class="colis-list" id="colis-list">
      <div class="empty-state">Chargement...</div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
  let currentUser = null;
  let allColis = [];
  let fournisseurs = [];
  let activeFilter = 'tous';

  function addMsg(text, type){
    document.getElementById('add-msg').innerHTML = `<div class="msg msg-${type}">${text}</div>`;
  }

  async function uploadPhoto(file, userId){
    const ext = file.name.split('.').pop();
    const path = `${userId}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const { error } = await supabaseClient.storage.from('colis-photos').upload(path, file);
    if (error) { console.error(error); return null; }
    const { data } = supabaseClient.storage.from('colis-photos').getPublicUrl(path);
    return data.publicUrl;
  }

  async function loadFournisseurs(){
    const { data, error } = await supabaseClient
      .from('profiles')
      .select('id, full_name, company_name')
      .eq('role', 'fournisseur')
      .order('full_name');
    if (error) { console.error(error); return; }
    fournisseurs = data;
    const select = document.getElementById('add-fournisseur');
    select.innerHTML = '<option value="">— Sélectionner —</option>' +
      data.map(f => `<option value="${f.id}">${f.company_name || f.full_name || f.id}</option>`).join('');
  }

  document.getElementById('form-add-colis').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-submit-colis');
    btn.disabled = true; btn.textContent = 'Ajout...';

    const fournisseur_id = document.getElementById('add-fournisseur').value;
    const destination = document.getElementById('add-dest').value.trim();
    const description = document.getElementById('add-desc').value.trim();
    const fileInput = document.getElementById('add-photo');
    let photo_url = null;

    if (fileInput.files && fileInput.files[0]) {
      photo_url = await uploadPhoto(fileInput.files[0], currentUser.id);
    }

    const { error } = await supabaseClient.from('colis').insert([{
      fournisseur_id, destination, description, photo_url
    }]);

    btn.disabled = false; btn.textContent = 'Ajouter le colis';

    if (error) {
      addMsg("Erreur : " + error.message, "error");
      return;
    }
    addMsg("Colis ajouté avec succès.", "success");
    e.target.reset();
    loadColis();
  });

  const FILTER_LABELS = { tous: 'Tous', en_attente: 'En attente', recupere: 'Récupéré', en_livraison: 'En livraison', livre: 'Livré', probleme: 'Problème' };

  function renderFilters(){
    const box = document.getElementById('filters');
    box.innerHTML = Object.keys(FILTER_LABELS).map(key =>
      `<div class="filter-chip ${activeFilter===key?'active':''}" data-filter="${key}">${FILTER_LABELS[key]}</div>`
    ).join('');
    box.querySelectorAll('.filter-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        activeFilter = chip.dataset.filter;
        renderFilters();
        renderColis();
      });
    });
  }

  function fournisseurLabel(id){
    const f = fournisseurs.find(x => x.id === id);
    if (!f) return 'Fournisseur inconnu';
    return f.company_name || f.full_name || id;
  }

  function colisRowHTML(c){
    const thumb = c.photo_url
      ? `<img src="${c.photo_url}" class="thumb">`
      : `<div class="thumb-placeholder">Pas de photo</div>`;
    const statutOptions = Object.keys(STATUTS).map(k =>
      `<option value="${k}" ${c.statut===k?'selected':''}>${STATUTS[k].label}</option>`).join('');

    return `
      <div class="colis-item" data-id="${c.id}">
        ${thumb}
        <div class="info">
          <div class="desc">${c.description || '(sans description)'}</div>
          <div class="meta">Fournisseur : ${fournisseurLabel(c.fournisseur_id)}${c.destination ? ' · Vers : ' + c.destination : ''}</div>
          <div class="meta">Ajouté le ${formatDate(c.created_at)}</div>
          <div class="field" style="margin-top:8px;">
            <input type="text" class="row-livreur" placeholder="Nom du livreur" value="${c.livreur_nom || ''}" style="padding:7px 10px; font-size:12.5px; border:1.5px solid var(--border); border-radius:7px; width:180px;">
          </div>
        </div>
        <div class="status-col">
          <select class="status-select">${statutOptions}</select>
          <button class="btn btn-sm btn-save" style="margin-top:4px;">Enregistrer</button>
        </div>
      </div>
    `;
  }

  function renderColis(){
    const list = document.getElementById('colis-list');
    const filtered = activeFilter === 'tous' ? allColis : allColis.filter(c => c.statut === activeFilter);
    if (!filtered.length) {
      list.innerHTML = `<div class="empty-state">Aucun colis${activeFilter !== 'tous' ? ' avec ce statut' : ''}.</div>`;
      return;
    }
    list.innerHTML = filtered.map(colisRowHTML).join('');

    list.querySelectorAll('.btn-save').forEach(btn => {
      btn.addEventListener('click', async () => {
        const item = btn.closest('.colis-item');
        const id = item.dataset.id;
        const statut = item.querySelector('.status-select').value;
        const livreur_nom = item.querySelector('.row-livreur').value.trim();
        btn.disabled = true; btn.textContent = '...';
        const { error } = await supabaseClient.from('colis').update({ statut, livreur_nom }).eq('id', id);
        btn.disabled = false; btn.textContent = 'Enregistrer';
        if (error) { alert("Erreur : " + error.message); }
      });
    });
  }

  async function loadColis(){
    const { data, error } = await supabaseClient
      .from('colis')
      .select('*')
      .order('created_at', { ascending: false });
    if (error) { console.error(error); return; }
    allColis = data;
    renderColis();
  }

  async function init(){
    const session = await requireAuth();
    if (!session) return;
    currentUser = session.user;

    const profile = await getProfile(currentUser.id);
    if (!profile || profile.role !== 'equipe') {
      window.location.href = 'fournisseur.html';
      return;
    }

    document.getElementById('user-name').textContent = profile.full_name || '';

    renderFilters();
    await loadFournisseurs();
    await loadColis();

    // Mises à jour en temps réel sur tous les colis
    supabaseClient
      .channel('colis-equipe')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'colis' }, () => {
        loadColis();
      })
      .subscribe();
  }

  init();
</script>
</body>
</html>
