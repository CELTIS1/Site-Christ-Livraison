<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord Équipe | Christ Livraison & Transport SARL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="topbar">
<div class="brand"><div class="logo-mark">CLT</div> Tableau de bord — Équipe</div>
<div class="user-info">
<span id="user-name"></span>
<span class="role-pill">Équipe interne</span>
<button class="btn-logout" onclick="logout()">Déconnexion</button>
</div>
</div>

<div class="wrap">
<div class="page-title">Suivi des colis</div>
<div class="page-sub">Tous les colis enregistrés par les fournisseurs, en temps réel.</div>

<div class="card">
<h2>Comptes en attente de validation</h2>
<div id="pending-list">
<div class="empty-state">Chargement...</div>
</div>
</div>

<div class="card">
<h2>Créer un compte livreur</h2>
<div id="add-livreur-msg"></div>
<form id="form-add-livreur">
<div class="field-row">
<div class="field">
<label>Nom complet</label>
<input type="text" id="lv-fullname" required placeholder="Nom du livreur">
</div>
<div class="field">
<label>Téléphone</label>
<input type="tel" id="lv-phone" required placeholder="07 00 00 00 00">
</div>
</div>
<button type="submit" class="btn" id="btn-submit-livreur">Créer le compte livreur</button>
</form>
</div>

<div class="card">
<h2>Ajouter un colis pour un fournisseur</h2>
<div id="add-msg"></div>
<form id="form-add-colis">
<div class="field-row">
<div class="field">
<label>Fournisseur</label>
<select id="add-fournisseur" required>
<option value="">— Sélectionner —</option>
</select>
</div>
<div class="field">
<label>Destination</label>
<input type="text" id="add-dest" placeholder="Ex : Cocody, Angré">
</div>
</div>
<div class="field">
<label>Description du colis</label>
<textarea id="add-desc" placeholder="Ex : Carton de vêtements, 5kg" required></textarea>
</div>
<div class="field">
<label>Photo (optionnel)</label>
<input type="file" id="add-photo" accept="image/*">
</div>
<button type="submit" class="btn" id="btn-submit-colis">Ajouter le colis</button>
</form>
</div>

<div class="card">
<h2>Tous les colis</h2>
<div class="filters" id="filters"></div>
<div class="colis-list" id="colis-list">
<div class="empty-state">Chargement...</div>
</div>
</div>
</div>

<script src="config.js"></script>
<script>
let currentUser = null;
let allColis = [];
let fournisseurs = [];
let livreurs = [];
let pendingAccounts = [];
let activeFilter = 'tous';

function addMsg(text, type){
document.getElementById('add-msg').innerHTML = `<div class="msg msg-${type}">${text}</div>`;
}

function addLivreurMsg(text, type){
document.getElementById('add-livreur-msg').innerHTML = `<div class="msg msg-${type}">${text}</div>`;
}

async function uploadPhoto(file, userId){
const ext = file.name.split('.').pop();
const path = `${userId}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
const { error } = await supabaseClient.storage.from('colis-photos').upload(path, file);
if (error) { console.error(error); return null; }
const { data } = supabaseClient.storage.from('colis-photos').getPublicUrl(path);
return data.publicUrl;
}

async function loadFournisseurs(){
const { data, error } = await supabaseClient
.from('profiles')
.select('id, full_name, company_name')
.eq('role', 'fournisseur')
.order('full_name');
if (error) { console.error(error); return; }
fournisseurs = data;
const select = document.getElementById('add-fournisseur');
select.innerHTML = '<option value="">— Sélectionner —</option>' +
data.map(f => `<option value="${f.id}">${f.company_name || f.full_name || f.id}</option>`).join('');
}

function pendingRowHTML(p){
return `
<div class="colis-item" data-id="${p.id}">
<div class="info">
<div class="desc">${p.full_name || '(sans nom)'}${p.company_name ? ' — ' + p.company_name : ''}</div>
<div class="meta">Rôle demandé : ${p.role || 'fournisseur'}${p.phone ? ' · Tél : ' + p.phone : ''}</div>
</div>
<div class="status-col">
<button class="btn btn-sm btn-valider" style="margin-bottom:4px;">Valider</button>
<button class="btn btn-sm btn-rejeter" style="background:#c0392b;">Rejeter</button>
</div>
</div>
`;
}

function renderPending(){
const box = document.getElementById('pending-list');
if (!pendingAccounts.length) {
box.innerHTML = `<div class="empty-state">Aucun compte en attente de validation.</div>`;
return;
}
box.innerHTML = pendingAccounts.map(pendingRowHTML).join('');

box.querySelectorAll('.btn-valider').forEach(btn => {
btn.addEventListener('click', async () => {
const id = btn.closest('.colis-item').dataset.id;
btn.disabled = true; btn.textContent = '...';
const { error } = await supabaseClient.from('profiles').update({ status: 'valide' }).eq('id', id);
if (error) { alert("Erreur : " + error.message); btn.disabled = false; btn.textContent = 'Valider'; return; }
await loadPending();
});
});
box.querySelectorAll('.btn-rejeter').forEach(btn => {
btn.addEventListener('click', async () => {
const id = btn.closest('.colis-item').dataset.id;
if (!confirm("Rejeter ce compte ?")) return;
btn.disabled = true; btn.textContent = '...';
const { error } = await supabaseClient.from('profiles').update({ status: 'rejete' }).eq('id', id);
if (error) { alert("Erreur : " + error.message); btn.disabled = false; btn.textContent = 'Rejeter'; return; }
await loadPending();
});
});
}

async function loadPending(){
const { data, error } = await supabaseClient
.from('profiles')
.select('id, role, full_name, company_name, phone, status')
.eq('status', 'en_attente')
.order('full_name');
if (error) { console.error(error); return; }
pendingAccounts = data;
renderPending();
}

async function loadLivreurs(){
const { data, error } = await supabaseClient
.from('profiles')
.select('id, full_name, phone')
.eq('role', 'livreur')
.order('full_name');
if (error) { console.error(error); return; }
livreurs = data;
renderColis();
}

document.getElementById('form-add-livreur').addEventListener('submit', async (e) => {
e.preventDefault();
const btn = document.getElementById('btn-submit-livreur');
btn.disabled = true; btn.textContent = 'Création...';

const full_name = document.getElementById('lv-fullname').value.trim();
const phone = document.getElementById('lv-phone').value.trim();

try {
const { data: { session } } = await supabaseClient.auth.getSession();
const res = await fetch(`${SUPABASE_URL}/functions/v1/creer-livreur`, {
method: 'POST',
headers: {
'Content-Type': 'application/json',
'Authorization': `Bearer ${session.access_token}`,
'apikey': SUPABASE_KEY,
},
body: JSON.stringify({ full_name, phone }),
});
const result = await res.json();

if (!res.ok) {
addLivreurMsg("Erreur : " + (result.error || 'création impossible'), "error");
} else {
addLivreurMsg("Compte livreur créé avec succès.", "success");
e.target.reset();
await loadLivreurs();
}
} catch (err) {
addLivreurMsg("Erreur : " + err.message, "error");
}

btn.disabled = false; btn.textContent = 'Créer le compte livreur';
});

document.getElementById('form-add-colis').addEventListener('submit', async (e) => {
e.preventDefault();
const btn = document.getElementById('btn-submit-colis');
btn.disabled = true; btn.textContent = 'Ajout...';

const fournisseur_id = document.getElementById('add-fournisseur').value;
const destination = document.getElementById('add-dest').value.trim();
const description = document.getElementById('add-desc').value.trim();
const fileInput = document.getElementById('add-photo');
let photo_url = null;

if (fileInput.files && fileInput.files[0]) {
photo_url = await uploadPhoto(fileInput.files[0], currentUser.id);
}

const { error } = await supabaseClient.from('colis').insert([{
fournisseur_id, destination, description, photo_url
}]);

btn.disabled = false; btn.textContent = 'Ajouter le colis';

if (error) {
addMsg("Erreur : " + error.message, "error");
return;
}
addMsg("Colis ajouté avec succès.", "success");
e.target.reset();
loadColis();
});

const FILTER_LABELS = { tous: 'Tous', en_attente: 'En attente', recupere: 'Récupéré', en_livraison: 'En livraison', livre: 'Livré', probleme: 'Problème' };

function renderFilters(){
const box = document.getElementById('filters');
box.innerHTML = Object.keys(FILTER_LABELS).map(key =>
`<div class="filter-chip ${activeFilter===key?'active':''}" data-filter="${key}">${FILTER_LABELS[key]}</div>`
).join('');
box.querySelectorAll('.filter-chip').forEach(chip => {
chip.addEventListener('click', () => {
activeFilter = chip.dataset.filter;
renderFilters();
renderColis();
});
});
}

function fournisseurLabel(id){
const f = fournisseurs.find(x => x.id === id);
if (!f) return 'Fournisseur inconnu';
return f.company_name || f.full_name || id;
}

function colisRowHTML(c){
const thumb = c.photo_url
? `<img src="${c.photo_url}" class="thumb">`
: `<div class="thumb-placeholder">Pas de photo</div>`;
const statutOptions = Object.keys(STATUTS).map(k =>
`<option value="${k}" ${c.statut===k?'selected':''}>${STATUTS[k].label}</option>`).join('');
const livreurOptions = '<option value="">— Aucun livreur —</option>' +
livreurs.map(l => `<option value="${l.id}" ${c.livreur_id===l.id?'selected':''}>${l.full_name || l.id}</option>`).join('');

return `
<div class="colis-item" data-id="${c.id}">
${thumb}
<div class="info">
<div class="desc">${c.description || '(sans description)'}</div>
<div class="meta">Fournisseur : ${fournisseurLabel(c.fournisseur_id)}${c.destination ? ' · Vers : ' + c.destination : ''}</div>
<div class="meta">Ajouté le ${formatDate(c.created_at)}</div>
<div class="field" style="margin-top:8px;">
<label style="font-size:11.5px;">Livreur assigné</label>
<select class="row-livreur-select" style="padding:7px 10px; font-size:12.5px; border:1.5px solid var(--border); border-radius:7px; width:200px;">${livreurOptions}</select>
</div>
</div>
<div class="status-col">
<select class="status-select">${statutOptions}</select>
<button class="btn btn-sm btn-save" style="margin-top:4px;">Enregistrer</button>
</div>
</div>
`;
}

function renderColis(){
const list = document.getElementById('colis-list');
const filtered = activeFilter === 'tous' ? allColis : allColis.filter(c => c.statut === activeFilter);
if (!filtered.length) {
list.innerHTML = `<div class="empty-state">Aucun colis${activeFilter !== 'tous' ? ' avec ce statut' : ''}.</div>`;
return;
}
list.innerHTML = filtered.map(colisRowHTML).join('');

list.querySelectorAll('.btn-save').forEach(btn => {
btn.addEventListener('click', async () => {
const item = btn.closest('.colis-item');
const id = item.dataset.id;
const statut = item.querySelector('.status-select').value;
const livreur_id = item.querySelector('.row-livreur-select').value || null;
btn.disabled = true; btn.textContent = '...';
const { error } = await supabaseClient.from('colis').update({ statut, livreur_id }).eq('id', id);
btn.disabled = false; btn.textContent = 'Enregistrer';
if (error) { alert("Erreur : " + error.message); }
});
});
}

async function loadColis(){
const { data, error } = await supabaseClient
.from('colis')
.select('*')
.order('created_at', { ascending: false });
if (error) { console.error(error); return; }
allColis = data;
renderColis();
}

async function init(){
const session = await requireAuth();
if (!session) return;
currentUser = session.user;

const profile = await getProfile(currentUser.id);
if (!profile || profile.role !== 'equipe') {
window.location.href = profile && profile.role === 'livreur' ? 'livreur.html' : 'fournisseur.html';
return;
}

document.getElementById('user-name').textContent = profile.full_name || '';

renderFilters();
await loadPending();
await loadFournisseurs();
await loadLivreurs();
await loadColis();

// Mises à jour en temps réel sur tous les colis
supabaseClient
.channel('colis-equipe')
.on('postgres_changes', { event: '*', schema: 'public', table: 'colis' }, () => {
loadColis();
})
.subscribe();

// Mises à jour en temps réel sur les comptes en attente de validation
supabaseClient
.channel('profiles-equipe')
.on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => {
loadPending();
loadFournisseurs();
loadLivreurs();
})
.subscribe();
}

init();
</script>
</body>
</html>
