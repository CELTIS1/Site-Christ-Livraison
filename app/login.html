<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Espace Colis | Christ Livraison & Transport SARL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
<body>
  <div class="login-page">
    <div class="login-box">
      <div class="login-logo">
        <div class="logo-mark">CLT</div>
      </div>
      <div class="login-title">Espace Colis</div>
      <div class="login-sub">Christ Livraison & Transport SARL</div>

      <div class="tabs">
        <div class="tab active" id="tab-connexion" onclick="showTab('connexion')">Connexion</div>
        <div class="tab" id="tab-inscription" onclick="showTab('inscription')">Inscription fournisseur</div>
      </div>

      <div id="msg-box"></div>

      <!-- CONNEXION : téléphone + mot de passe -->
      <form id="form-connexion-login">
        <div class="field">
          <label>Numéro de téléphone</label>
        <input type="tel" id="login-phone" required placeholder="07 00 00 00 00">
        </div>
      <div class="field">
      <label>Mot de passe</label>
      <input type="password" id="login-password" required placeholder="Votre mot de passe">
      </div>
      <button type="submit" class="btn" style="width:100%; justify-content:center;" id="btn-login-submit">Se connecter</button>
      <button type="button" id="btn-goto-forgot" style="width:100%;text-align:center;margin-top:10px;background:none;border:none;color:#1B4374;text-decoration:underline;cursor:pointer;">Mot de passe oublié ou première connexion ?</button>
      </form>

    <!-- MOT DE PASSE OUBLIE : demande transmise à l'équipe -->
    <form id="form-forgot-phone" class="hidden">
    <div class="field">
    <label>Numéro de téléphone</label>
    <input type="tel" id="forgot-phone" required placeholder="07 00 00 00 00">
    </div>
    <div style="margin-bottom:14px;font-size:12.5px;color:#6b7280;">Votre demande sera transmise à notre équipe, qui vous communiquera un nouveau mot de passe.</div>
    <button type="submit" class="btn" style="width:100%; justify-content:center;" id="btn-forgot-send">Demander une réinitialisation</button>
    <button type="button" id="btn-forgot-cancel" style="width:100%;text-align:center;margin-top:10px;background:none;border:none;color:#1B4374;text-decoration:underline;cursor:pointer;">Retour à la connexion</button>
    </form>

    <!-- INSCRIPTION : formulaire en une étape (compte activé après validation par l'équipe) -->
    <form id="form-inscription" class="hidden">
    <div class="field">
    <label>Nom complet</label>
    <input type="text" id="reg-fullname" required placeholder="Votre nom">
    </div>
    <div class="field">
    <label>Nom de l'entreprise (optionnel)</label>
    <input type="text" id="reg-company" placeholder="Nom de votre société">
    </div>
    <div class="field">
    <label>Numéro de téléphone</label>
    <input type="tel" id="reg-phone" required placeholder="07 00 00 00 00">
    </div>
    <div class="field">
    <label>Créer un mot de passe</label>
    <input type="password" id="reg-password" required minlength="6" placeholder="6 caractères minimum">
    </div>
    <div class="field">
    <label>Confirmer le mot de passe</label>
    <input type="password" id="reg-password-confirm" required minlength="6" placeholder="Retapez le mot de passe">
    </div>
    <button type="submit" class="btn" style="width:100%; justify-content:center;" id="btn-register-submit">Créer mon compte fournisseur</button>
    <div style="margin-top:10px;font-size:12.5px;color:#6b7280;text-align:center;">Votre compte sera activé après validation par notre équipe.</div>
    </form>

    </div>
  </div>

<script src="config.js"></script>
<script>
  function showTab(which){
    document.getElementById('tab-connexion').classList.toggle('active', which==='connexion');
    document.getElementById('tab-inscription').classList.toggle('active', which==='inscription');
    document.getElementById('form-connexion-login').classList.toggle('hidden', which!=='connexion');
    document.getElementById('form-forgot-phone').classList.add('hidden');
    document.getElementById('form-inscription').classList.toggle('hidden', which!=='inscription');
    document.getElementById('msg-box').innerHTML = '';
  }

  function showMsg(text, type){
    document.getElementById('msg-box').innerHTML =
      '<div class="msg msg-' + type + '">' + text + '</div>';
  }

  // Convertit un numéro ivoirien saisi localement (ex: 07 89 81 81 40) au format attendu par Supabase Auth.
  // Depuis la reforme de 2021, les numeros ivoiriens ont 10 chiffres et commencent deja par 0
  // (ce 0 fait partie du numero, il ne s'agit pas d'un prefixe a retirer).
  // IMPORTANT : Supabase Auth stocke et compare les numéros de téléphone SANS le "+" initial
  // (format "2250789818140", pas "+2250789818140"). Utiliser un "+" ici casse la connexion
  // (le mot de passe peut être correct mais l'utilisateur ne sera jamais trouvé).
  function toE164(raw){
    let digits = raw.replace(/[^\d]/g, '');
    if (digits.startsWith('225')) digits = digits.slice(3);
    return '225' + digits;
  }

  // Si déjà connecté, redirige directement vers le bon espace
  (async function checkSession(){
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      const profile = await getProfile(session.user.id);
      const ok = await checkAccountStatus(profile);
      if (!ok) return;
      redirectByRole(profile);
    }
  })();

  function redirectByRole(profile){
    if (profile && profile.role === 'equipe') {
      window.location.href = 'equipe.html';
    } else if (profile && profile.role === 'livreur') {
      window.location.href = 'livreur.html';
    } else {
      window.location.href = 'fournisseur.html';
    }
  }

  // Vérifie que le compte est validé. Si en attente ou refusé, déconnecte et bloque l'accès.
  async function checkAccountStatus(profile){
    if (profile && profile.status === 'en_attente') {
      await supabaseClient.auth.signOut();
      showMsg("Votre compte est en attente de validation par notre équipe. Vous pourrez vous connecter dès qu'il sera validé.", "error");
      return false;
    }
    if (profile && profile.status === 'rejete') {
      await supabaseClient.auth.signOut();
      showMsg("Votre demande de compte a été refusée. Contactez notre équipe pour plus d'informations.", "error");
      return false;
    }
    return true;
  }

  // ---------- CONNEXION (téléphone + mot de passe) ----------
  document.getElementById('form-connexion-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-login-submit');
    btn.disabled = true; btn.textContent = 'Connexion...';

    const phone = toE164(document.getElementById('login-phone').value.trim());
    const password = document.getElementById('login-password').value;

    const { data, error } = await supabaseClient.auth.signInWithPassword({ phone, password });

    if (error) {
      showMsg("Erreur : numéro ou mot de passe incorrect.", "error");
      btn.disabled = false; btn.textContent = 'Se connecter';
      return;
    }

    const profile = await getProfile(data.user.id);
    const ok = await checkAccountStatus(profile);
    btn.disabled = false; btn.textContent = 'Se connecter';
    if (!ok) return;
    redirectByRole(profile);
  });

  // ---------- MOT DE PASSE OUBLIE / PREMIERE CONNEXION ----------
  let forgotPhone = '';

  document.getElementById('btn-goto-forgot').addEventListener('click', () => {
    document.getElementById('form-connexion-login').classList.add('hidden');
    document.getElementById('form-forgot-phone').classList.remove('hidden');
    document.getElementById('msg-box').innerHTML = '';
  });

  document.getElementById('btn-forgot-cancel').addEventListener('click', () => {
    document.getElementById('form-forgot-phone').classList.add('hidden');
    document.getElementById('form-connexion-login').classList.remove('hidden');
    document.getElementById('msg-box').innerHTML = '';
  });

  document.getElementById('form-forgot-phone').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-forgot-send');
    btn.disabled = true; btn.textContent = 'Envoi...';

    forgotPhone = toE164(document.getElementById('forgot-phone').value.trim());

    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/demander-reset-password`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'apikey': SUPABASE_KEY,
        },
        body: JSON.stringify({ phone: forgotPhone }),
      });
      const result = await res.json();

      if (!res.ok) {
        showMsg("Erreur : " + (result.error || 'demande impossible'), "error");
      } else {
        showMsg("Votre demande a été transmise à notre équipe. Vous serez contacté avec votre nouveau mot de passe.", "success");
        document.getElementById('form-forgot-phone').reset();
        document.getElementById('form-forgot-phone').classList.add('hidden');
        document.getElementById('form-connexion-login').classList.remove('hidden');
      }
    } catch (err) {
      showMsg("Erreur réseau. Réessayez.", "error");
    }

    btn.disabled = false; btn.textContent = 'Demander une réinitialisation';
  });

  // ---------- INSCRIPTION FOURNISSEUR (compte créé en attente de validation) ----------
  document.getElementById('form-inscription').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-register-submit');

    const full_name = document.getElementById('reg-fullname').value.trim();
    const company_name = document.getElementById('reg-company').value.trim();
    const phone = toE164(document.getElementById('reg-phone').value.trim());
    const password = document.getElementById('reg-password').value;
    const confirm = document.getElementById('reg-password-confirm').value;

    if (password !== confirm) {
      showMsg("Les deux mots de passe ne correspondent pas.", "error");
      return;
    }
    if (password.length < 6) {
      showMsg("Le mot de passe doit contenir au moins 6 caractères.", "error");
      return;
    }

    btn.disabled = true; btn.textContent = 'Création...';

    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/inscrire-fournisseur`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'apikey': SUPABASE_KEY,
        },
        body: JSON.stringify({ full_name, company_name, phone, password }),
      });
      const result = await res.json();

      if (!res.ok) {
        showMsg("Erreur : " + (result.error || 'création impossible'), "error");
      } else {
        showMsg("Compte créé avec succès. Il sera activé après validation par notre équipe — vous pourrez alors vous connecter.", "success");
        e.target.reset();
      }
    } catch (err) {
      showMsg("Erreur : " + err.message, "error");
    }

    btn.disabled = false; btn.textContent = 'Créer mon compte fournisseur';
  });
</script>
</body>
</html>
