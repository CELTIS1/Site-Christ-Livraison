# Contrôles automatiques du comportement de l'application.
#
# À quoi ça sert, en clair : certains comportements ne se voient pas à l'œil nu et sont pénibles
# à vérifier à la main — typiquement ce qui se passe quand la connexion tombe au milieu d'une
# saisie. Ces contrôles rejouent ces situations tout seuls à chaque publication. Si une
# modification casse l'un d'eux, on le sait avant que l'équipe s'en aperçoive sur le terrain.
#
# Aucun secret, aucun coût : c'est gratuit sur un dépôt public. Les outils installés : ESLint,
# Playwright (un Chromium sans écran pour les trois parcours). Aucune dépendance en production.

name: Contrôles automatiques

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tester:
    runs-on: ubuntu-latest
    steps:
      # Ces deux outils sont fournis par GitHub, pas par nous. Ils étaient restés en v4,
      # trois versions en arrière : GitHub avertissait à chaque publication qu'ils tournent
      # sur une version de Node qu'il ne veut plus faire tourner. Un avertissement de ce
      # genre finit toujours par devenir une panne, et le jour où elle tombe, ce n'est
      # jamais le bon jour. Les seuls changements de fond entre v4 et v7 concernent la
      # récupération du code d'une branche extérieure (« fork ») — ce dépôt n'en reçoit
      # pas — et le passage à une version de Node plus récente.
      - name: Récupérer le site
        uses: actions/checkout@v7

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Depuis le 16 septembre 2026 (feuille de route 4.9), les bancs ne sont plus listés un par
      # un ici (73 étapes, une par fichier, et un oubli à chaque nouveau banc) : `npm test` lance
      # tous les fichiers tests/*.test.mjs avec le lanceur intégré de Node, en parallèle, et
      # échoue si l'un d'eux échoue. Le détail de chaque banc reste lisible dans le journal.
      - name: Installer les outils (ESLint, Playwright ; aucune dépendance en production)
        run: npm ci --no-audit --no-fund

      - name: Tous les bancs d'essai (tests/*.test.mjs, un fichier = un sujet)
        run: npm test

      - name: ESLint minimal (déclarations en double, clés répétées, code inatteignable)
        run: npm run lint

      - name: Les flux de travail restent lisibles par GitHub (pas de « deux-points » dans un nom d'étape)
        run: node tests/workflows-lisibles.test.mjs

  # Les trois parcours dans un vrai navigateur (feuille de route 4.10, 16 septembre 2026) :
  # connexion du livreur, livraison d'un colis, relevé de la cliente. Chromium sans écran, site
  # servi depuis le dépôt, fausse base en mémoire — la vraie base n'est jamais touchée. Un
  # travail à part, pour que les bancs restent rapides même si le navigateur met du temps.
  parcours:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v7

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Installer les outils
        run: npm ci --no-audit --no-fund

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Les trois parcours (connexion du livreur, livraison d'un colis, relevé de la cliente)
        run: npm run parcours
