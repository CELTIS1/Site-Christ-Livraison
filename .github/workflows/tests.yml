# Contrôles automatiques du comportement de l'application.
#
# À quoi ça sert, en clair : certains comportements ne se voient pas à l'œil nu et sont pénibles
# à vérifier à la main — typiquement ce qui se passe quand la connexion tombe au milieu d'une
# saisie. Ces contrôles rejouent ces situations tout seuls à chaque publication. Si une
# modification casse l'un d'eux, on le sait avant que l'équipe s'en aperçoive sur le terrain.
#
# Aucune configuration à faire, aucun secret, aucun coût : c'est gratuit sur un dépôt public.

name: Contrôles automatiques

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tester:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: File d'attente hors-réseau (espace Équipe)
        run: node tests/file-attente-equipe.test.mjs

      - name: Actions rapides (un appui pour faire avancer un colis)
        run: node tests/actions-rapides.test.mjs

      - name: Affichage par tranches (une longue liste reste fluide et exacte)
        run: node tests/liste-longue.test.mjs

      - name: Actions en lot (traiter plusieurs colis d'un coup sans rien fausser)
        run: node tests/actions-en-lot.test.mjs

      - name: Carnet d'adresses (proposer sans jamais écraser une saisie)
        run: node tests/carnet-adresses.test.mjs

      - name: Chiffres par livreur (ne jamais afficher un chiffre qu'on ne sait pas calculer)
        run: node tests/chiffres-par-livreur.test.mjs

      - name: Coller la commande (remplir vite, sans jamais deviner)
        run: node tests/coller-la-commande.test.mjs

      - name: Saisie en lot par photos d'étiquettes (une ligne vide n'est pas un colis)
        run: node tests/saisie-en-lot.test.mjs

      - name: Porte d'écriture des colis (ni doublon, ni colis dépouillé de son numéro)
        run: node tests/porte-ecriture-colis.test.mjs

      - name: États de paie par période (un mois non saisi n'est pas un mois à zéro)
        run: node tests/etats-par-periode.test.mjs

      # Garde-fou : ce fichier est une liste tenue à la main, et une liste tenue à la main
      # finit toujours par prendre du retard. C'est arrivé : les deux séries ci-dessus ont
      # été écrites le 21 août et n'ont été branchées ici que le 23 — pendant deux jours,
      # 157 vérifications sur 614 ne tournaient à chaque publication que si quelqu'un y
      # pensait, et personne n'y pensait. Ce contrôle compare le contenu du dossier tests/
      # à ce qui est réellement lancé ci-dessus, et refuse la publication si l'un manque.
      # Il est placé en dernier pour qu'un vrai échec de contrôle se voie avant lui.
      - name: Aucune série de contrôles laissée de côté
        run: |
          manquantes=""
          for f in tests/*.test.mjs; do
            grep -qF "node $f" .github/workflows/tests.yml || manquantes="$manquantes $f"
          done
          if [ -n "$manquantes" ]; then
            echo "Ces séries de contrôles existent mais ne sont lancées nulle part :$manquantes"
            echo "Ajoutez-leur une étape « - name: … / run: node <fichier> » dans .github/workflows/tests.yml."
            exit 1
          fi
          echo "Les $(ls tests/*.test.mjs | wc -l) séries du dossier tests/ sont toutes branchées."
