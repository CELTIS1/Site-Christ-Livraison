# Contrôles automatiques du comportement de l'application.
#
# À quoi ça sert, en clair : certains comportements ne se voient pas à l'œil nu et sont pénibles
# à vérifier à la main — typiquement ce qui se passe quand la connexion tombe au milieu d'une
# saisie. Ces contrôles rejouent ces situations tout seuls à chaque publication. Si une
# modification casse l'un d'eux, on le sait avant que l'équipe s'en aperçoive sur le terrain.
#
# Aucune configuration à faire, aucun secret, aucun coût : c'est gratuit sur un dépôt public.

name: Contrôles automatiques

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tester:
    runs-on: ubuntu-latest
    steps:
      # Ces deux outils sont fournis par GitHub, pas par nous. Ils étaient restés en v4,
      # trois versions en arrière : GitHub avertissait à chaque publication qu'ils tournent
      # sur une version de Node qu'il ne veut plus faire tourner. Un avertissement de ce
      # genre finit toujours par devenir une panne, et le jour où elle tombe, ce n'est
      # jamais le bon jour. Les seuls changements de fond entre v4 et v7 concernent la
      # récupération du code d'une branche extérieure (« fork ») — ce dépôt n'en reçoit
      # pas — et le passage à une version de Node plus récente.
      - name: Récupérer le site
        uses: actions/checkout@v7

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: File d'attente hors-réseau (espace Équipe)
        run: node tests/file-attente-equipe.test.mjs

      - name: Actions rapides (un appui pour faire avancer un colis)
        run: node tests/actions-rapides.test.mjs

      - name: Affichage par tranches (une longue liste reste fluide et exacte)
        run: node tests/liste-longue.test.mjs

      - name: Actions en lot (traiter plusieurs colis d'un coup sans rien fausser)
        run: node tests/actions-en-lot.test.mjs

      - name: Carnet d'adresses (proposer sans jamais écraser une saisie)
        run: node tests/carnet-adresses.test.mjs

      - name: Chiffres par livreur (ne jamais afficher un chiffre qu'on ne sait pas calculer)
        run: node tests/chiffres-par-livreur.test.mjs

      - name: Coller la commande (remplir vite, sans jamais deviner)
        run: node tests/coller-la-commande.test.mjs

      - name: Saisie en lot par photos d'étiquettes (une ligne vide n'est pas un colis)
        run: node tests/saisie-en-lot.test.mjs

      - name: Porte d'écriture des colis (ni doublon, ni colis dépouillé de son numéro)
        run: node tests/porte-ecriture-colis.test.mjs

      - name: États de paie par période (un mois non saisi n'est pas un mois à zéro)
        run: node tests/etats-par-periode.test.mjs

      # Celle-ci ne se contente pas de relire du texte : elle ouvre le VRAI code des
      # fonctions serveur (des fichiers .ts) et le fait tourner, avec une fausse base de
      # données qui note tout ce qu'on lui demande d'écrire. C'est ce qui permet de
      # vérifier l'ordre des écritures — couper l'accès aux données AVANT de bloquer la
      # connexion — et pas seulement leur présence. Elle a besoin d'une version de Node
      # capable de lire du TypeScript sans outil supplémentaire : c'est le cas de la 22
      # installée plus haut.
      - name: Comptes du personnel (suspendre, corriger, réinitialiser sans mot de passe en clair)
        run: node tests/comptes-du-personnel.test.mjs

      # Même principe, pour les comptes clients et CLT Express. Deux des fonctions
      # mises à l'épreuve ici sont ouvertes à tout Internet (elles servent au « mot
      # de passe oublié », donc avant toute connexion) : ce sont exactement celles
      # qu'il vaut mieux ne pas casser sans s'en rendre compte.
      - name: Comptes clients et Express (code SMS, mot de passe oublié, coupure des données)
        run: node tests/comptes-clients-et-express.test.mjs

      # Corriger l'adresse d'un colis déjà parti : les fenêtres de modification doivent dire
      # la même chose dans l'écran et dans la base. Une partie de cette série relit le script
      # SQL, qui n'est pas publié ; ici elle annonce ce qu'elle ne peut pas vérifier au lieu
      # de s'arrêter. Le reste — ce que chaque écran envoie réellement — tourne bel et bien.
      - name: Correction d'adresse d'un colis (l'écran et la base disent la même chose)
        run: node tests/corriger-adresse-colis.test.mjs

      # Les montants corrigés depuis la rue. Ce que le livreur tape sur le pas de la porte, la
      # cliente le lit le soir même sur son relevé et le réclame le lendemain : une erreur ici
      # sort de la maison et ne se rattrape plus. La série tient les deux poches ensemble — un
      # vieux colis ne doit jamais ressortir à moitié converti, sa livraison tombée à zéro toute
      # seule — repose la question au-delà de dix mille francs d'écart POCHE PAR POCHE, exécute
      # le vrai geste d'enregistrement pour regarder ce qui part vers la base, et vérifie qu'une
      # correction faite hors connexion attend en file au lieu de disparaître. Elle garde aussi
      # la trace : elle est tenue par un déclencheur de la base, jamais par le navigateur, sinon
      # elle sauterait dès qu'on écrit le montant par un autre chemin. Comme les deux séries
      # ci-dessus, sa dernière section relit un script SQL non publié et annonce ce qu'elle ne
      # peut pas vérifier au lieu de s'arrêter. Les 21 sabotages passés dessus le 27 août l'ont
      # tous fait passer au rouge — c'est la seule preuve qui vaille qu'elle tient quelque chose.
      - name: Montants corrigés par le livreur (les deux poches, et la trace)
        run: node tests/montants-corriges-par-le-livreur.test.mjs

      # La tournée de récupération, écrite la veille au soir et lue le lendemain matin. Ce qui
      # est en jeu, c'est le premier geste de la journée d'un livreur : une liste vide alors
      # qu'on l'attend quelque part, et il reste chez lui pendant qu'une cliente appelle à dix
      # heures. Cette série tient donc trois choses que rien d'autre ne tient : qu'une journée
      # PAS ENCORE ARRIVÉE annonce « à venir » au lieu d'un zéro fabriqué ; qu'une cliente sans
      # colis reste affichée au lieu de disparaître ; et qu'une lecture en échec le DISE, au
      # lieu de se lire « je n'ai rien à faire ce matin ». Elle exécute les vrais écrans — le
      # bouton « Ajouter », le bouton « Retirer », les commandes de date — au lieu de relire
      # leur code, parce que le sabotage a montré que la relecture laissait passer un écran
      # ouvert sur le mauvais jour et une écriture partie sans cliente ni livreur. Sa dernière
      # section relit le script SQL non publié et annonce ce qu'elle ne peut pas vérifier au
      # lieu de s'arrêter. Les 28 sabotages du 27 août l'ont tous fait passer au rouge.
      - name: Tournée de récupération (programmée la veille, lue le matin)
        run: node tests/tournee-de-recuperation.test.mjs

      # Le pendant du précédent, depuis le 30/08/2026. Ce que la cliente annonce au téléphone
      # est la seule chose qui distingue « je passe chercher trois colis » de « je passe pour
      # rien ». Sans cette distinction, l'écran du livreur disait « rien à récupérer » chez une
      # cliente où le bureau l'envoyait exprès, et son bouton « Je pars » disparaissait de
      # l'écran — donc le partage de position ne démarrait plus. Constaté sur un iPhone.
      - name: La cliente annonce ses colis (l'annoncé, le saisi, et l'écart entre les deux)
        run: node tests/la-cliente-annonce-ses-colis.test.mjs

      # L'argent. Un bouton mal placé, on le signale ; un total faux, on le RECOPIE — dans un
      # carnet, dans un message, dans la remise du soir — et il devient quelques jours plus
      # tard la version des faits que plus personne ne peut contester. Cette série tient les
      # cinq règles arrêtées le 25 août : les deux poches ne se mélangent jamais, livré =
      # encaissé, encaissé n'est pas reversé, enregistré n'est pas encaissé, et l'invariant
      # encaissé = déjà reversé + reste dû. Comme la précédente, sa dernière section relit un
      # script SQL non publié et s'annonce non applicable ici plutôt que de tout arrêter.
      - name: L'argent des colis (deux poches, jamais mélangées)
        run: node tests/argent-des-colis.test.mjs

      # L'expédition, depuis le 01/09/2026. C'est le seul cas où CLT n'encaisse rien : le
      # destinataire a déjà payé chez la vendeuse avant le départ. Deux frais se retiennent
      # alors sur elle — le transporteur, et la course du livreur — et son relevé peut être
      # négatif. Une première tentative avait été entièrement annulée le 31 août : elle avait
      # corrigé UNE des quatre formules qui répondaient à « combien doit-on à cette cliente »,
      # et le document envoyé annonçait 30 000 quand l'écran de la même cliente disait 15 000.
      # Cette série ne vérifie donc pas seulement que le calcul est juste : elle vérifie qu'il
      # n'y en a QU'UN, en exigeant que tous les chemins d'affichage bougent ensemble.
      - name: L'argent de l'expédition (un seul calcul, deux frais, un signe qui compte)
        run: node tests/l-argent-de-l-expedition.test.mjs

      # Le contrôle croisé des écrans. Le 25 août, le téléphone d'un livreur affichait 11 000
      # en main et le tableau de l'équipe lui en réclamait 14 000 : il avait payé 3 000 à la
      # gare le matin, sur un colis qui n'arrivait que le lendemain, et le tableau de l'équipe
      # ne regardait que les colis livrés. Personne n'avait tort — deux écrans posaient la même
      # question et comptaient différemment. C'est la seule espèce de défaut qui se termine en
      # dispute, parce que chacun tient un chiffre affiché par l'application elle-même.
      # Cette série EXÉCUTE réellement le tableau de l'équipe dans un faux navigateur et relit
      # les cellules produites une à une : son total doit valoir, au franc près, celui que le
      # téléphone du livreur calcule. Elle garde aussi qu'une avance de gare se retranche une
      # fois et une seule, et qu'un colis pas encore livré n'est jamais marqué « remis ».
      - name: Contrôle croisé des écrans (l'équipe et le livreur disent le même chiffre)
        run: node tests/controle-croise-des-ecrans.test.mjs

      # L'écran qui ne bouge pas. Signalé le 25 août : « ça s'actualise, ça vibre, et les données
      # saisies s'effacent ». L'application redessinait de grands blocs avec un contenu identique
      # à celui déjà affiché ; le navigateur, lui, ne peut pas le deviner et détruit tout. Cette
      # série extrait la vraie garde du fichier source et la fait tourner, puis monte le guet sur
      # les rechutes : aucun écran ne doit réécrire une liste sans comparer, et toute page qui
      # appelle cltPoserHTML doit charger clt-common.js — les écrans Express n'ont pas config.js.
      - name: L'écran ne se réécrit plus à l'identique (les saisies ne s'effacent plus)
        run: node tests/ecran-qui-ne-bouge-pas.test.mjs

      # La fiche « Son écran ». Jusqu'ici, personne à l'équipe ne pouvait voir ce qu'un livreur —
      # ou une vendeuse — a réellement sous les yeux : on assignait des colis toute la journée
      # sans jamais pouvoir vérifier l'autre bout. La fiche répond à ça, mais la façon évidente
      # de l'écrire aurait été de redessiner un tableau RESSEMBLANT à celui du livreur — donc un
      # TROISIÈME chiffre, et le seul dont personne n'aurait su lequel des deux autres il
      # contredit. Cette série exécute réellement les deux écrans sur les mêmes colis et compare
      # les tableaux produits CARACTÈRE POUR CARACTÈRE. Elle garde aussi la porte de correction :
      # une seule écriture dans toute la fiche, la trace au journal posée après l'écriture et
      # jamais avant, et « corriger les montants » qui n'écrit rien du tout.
      - name: La fiche « Son écran » (l'équipe voit exactement ce que le livreur voit)
        run: node tests/fiche-son-ecran.test.mjs

      # Le bandeau « nouvelle version disponible ». Le 26 août, la fiche « Son écran » a été
      # publiée, vérifiée fichier par fichier sur le serveur, et est restée invisible une
      # journée entière : une application installée ne recharge pas toute seule, et rien ne
      # lui disait qu'une nouvelle version existait. Publier « avec succès » sans que rien ne
      # change pour personne est le pire des deux mondes. Cette série garde les deux pièges du
      # remède : ne JAMAIS recharger d'autorité (une actualisation pendant une saisie efface
      # les champs — le défaut déjà signalé en août), et ne jamais crier au loup quand on ne
      # sait pas (réseau coupé, repère illisible). Elle refuse aussi la publication si
      # app/version.json cesse d'annoncer exactement l'étiquette portée par les pages : en
      # avance, le bandeau s'affiche en permanence et ne veut plus rien dire ; en retard,
      # plus personne ne le voit et on retombe dans le trou du 26 août.
      - name: Le bandeau « nouvelle version » (l'équipe apprend qu'une publication a eu lieu)
        run: node tests/bandeau-nouvelle-version.test.mjs

      # Le choix du livreur dans « Tous les colis ». Un filtre a l'air anodin, mais il décide de
      # ce que l'écran MONTRE, donc de ce que l'équipe croit exister. Deux pièges gardés ici :
      # confondre « tous les livreurs » avec « pas encore assignés » ferait disparaître de la vue
      # les colis qui n'ont été confiés à personne — précisément ceux qu'il ne faut jamais perdre
      # de vue ; et changer de livreur sans vider la sélection multiple laisserait des colis
      # cochés invisibles, qu'une assignation en lot ramasserait au passage.
      - name: Choix du livreur dans la liste des colis (voir le travail d'un seul, sans rien perdre)
        run: node tests/filtre-par-livreur.test.mjs

      # La barre du haut, le bandeau de mise à jour, et le bouton 🔄. Signalés ensemble le
      # 26 août : l'ancienne saisie encombrait tous les écrans, la roue dentée se retrouvait
      # seule à gauche sur une troisième ligne et son menu s'ouvrait hors de l'écran, le
      # bandeau de mise à jour se posait sur l'heure et sur l'en-tête, et le bouton
      # d'actualisation « avait l'air de ne rien faire ». La dernière section de cette série
      # ne relit pas le bouton : elle l'EXÉCUTE, avec une horloge qu'on avance à la main, et
      # rejoue le cas qui ne se voit pas à la lecture — une requête qui ne revient jamais
      # laissait le bouton grisé pour toujours, et là il n'avait plus seulement l'air mort.
      - name: Barre du haut, bandeau de mise à jour et bouton d'actualisation
        run: node tests/barre-du-haut-et-actualiser.test.mjs

      # Le récapitulatif par livreur, et le haut de la fiche « Son écran ». Demandés ensemble le
      # 26 août : on ne pouvait vérifier un livreur qu'en trouvant sa ligne dans la comptabilité,
      # et la fiche qui s'ouvrait alors avait son titre et sa croix imprimés sous la barre d'état
      # du téléphone — « même pour vouloir sortir de là, c'est vraiment difficile ». Cette série
      # garde surtout l'essentiel : l'addition d'argent a été sortie de l'écran de comptabilité
      # et posée dans config.js, et les DEUX écrans l'appellent. Elle vérifie qu'il n'en existe
      # qu'une, que ses chiffres sont justes jusqu'au cas où CLT doit de l'argent au livreur, et
      # que la colonne affichée se recompose exactement en le total de la caisse.
      - name: Récapitulatif par livreur et haut de la fiche « Son écran »
        run: node tests/recapitulatif-par-livreur.test.mjs

      # Le partage de position du livreur, repris le 26 août parce qu'il était « mal géré ».
      # La pastille verte s'allumait à l'instant où on DEMANDAIT le partage, avant que le
      # moindre point soit parti : elle promettait à l'équipe une position qu'elle n'avait
      # pas encore. Et quand le téléphone refusait la géolocalisation, l'avertissement
      # s'affichait bien, mais le rafraîchissement automatique le réécrivait toutes les
      # vingt-cinq secondes — le livreur voyait passer un message qu'il n'avait pas le temps
      # de lire, et le suivi restait refermé sans qu'aucun nouvel essai puisse le rouvrir.
      # Cette série n'inspecte pas le code : elle l'EXÉCUTE, avec un faux GPS, un faux écran
      # et une fausse base, y compris le vrai watchPosition de config.js. Elle tient aussi le
      # seuil d'« en ligne » identique à celui de la carte de l'équipe : deux écrans qui
      # parlent du même livreur ne doivent pas pouvoir se contredire. Dernière section : la
      # vignette grise « Pas de photo », retirée de l'écran du livreur — où elle prenait
      # 40 px sur 390 pour annoncer qu'il n'y a rien à voir — et gardée sur les grands écrans.
      - name: Partage de position du livreur et vignette sans photo
        run: node tests/partage-de-position.test.mjs

      # Les trois écrans que nos clients ont dans la poche : la vendeuse (fournisseur.html, mal
      # nommé — c'est l'« Espace Client »), le client CLT Express et le coursier Express. Épurés
      # le 26 août dans la foulée de l'écran du livreur : salutation retirée du haut de page,
      # doublons retirés des cartes, sections rangées dans leurs onglets. Retirer est un travail
      # qui ne laisse aucune trace : rien ne dira dans six mois que la ligne « Ajouté le … » est
      # partie parce que la date est déjà écrite en tête de groupe, et quelqu'un la remettra de
      # bonne foi. Cette série est le seul endroit où une suppression peut se défendre.
      # Elle n'inspecte pas du texte : elle EXÉCUTE colisItemHTML, courseRowHTML,
      # positionEtatLigne et relocateCoursierSections, et lit ce qu'elles produisent. C'est ce
      # qui lui a permis de trouver trois défauts au passage — un observateur JavaScript qui
      # tournait à chaque ouverture pour souligner des liens masqués depuis des mois, deux
      # sections du coursier jamais rangées dans un onglet et donc affichées sous tous, et le
      # voyant de position du coursier qui promettait du vert avant qu'un point soit parti.
      - name: Les trois écrans clients (ce qui en a été retiré, et pourquoi)
        run: node tests/ecrans-clients.test.mjs

      # La vue par jour, dans « Rapports ». C'est l'écran qu'on ouvre le soir pour savoir comment
      # la journée s'est passée ; un chiffre faux n'y est pas un défaut d'affichage, c'est une
      # décision prise de travers le lendemain matin. Le défaut corrigé : l'écran comptait les
      # colis à leur date d'ENREGISTREMENT, ce qui gonflait le jour de la saisie et vidait celui
      # du travail réellement fait. Un colis enregistré le 24 et livré le 26 est une livraison du
      # 26. Cette série extrait le vrai code de config.js et l'exécute sur des colis choisis :
      # elle garde le jour de l'événement, le jour d'Abidjan (deux personnes qui parlent du mardi
      # doivent parler du même mardi), le refus d'inventer un jour pour un colis sans horodatage,
      # la ligne Total égale à la somme exacte des lignes au-dessus, et le fait qu'un colis sans
      # livreur n'est imputé à personne — surtout pas à un « inconnu » qui ferait nombre.
      - name: Vue par jour et par livreur (un colis compte le jour où le travail a été fait)
        run: node tests/colis-par-jour-et-par-livreur.test.mjs

      # Le relevé du soir d'une cliente. Demandé pour être imprimé en PDF, en Excel ou en Word et
      # envoyé chaque soir à la vendeuse : « voilà ce qu'on a récupéré, ce qu'on a pu livrer, avec
      # les détails ». Un document qui sort de l'application et qui part chez une cliente n'est pas
      # un écran de plus, c'est un engagement écrit — il ne se corrige pas d'un coup de touche
      # « actualiser ». L'export qui existait avant ne sortait qu'une colonne « Montant », valant
      # l'article enregistré, et son total additionnait le livré ET le non-livré ; l'écran, lui,
      # affichait « Article » et « Encaissé » et annonçait le second comme la somme due. Le papier
      # promettait donc plus que l'écran ne réclamait : la faute du 25 août, mais imprimée et avec
      # un nom dessus. Même remède que ce jour-là — sortir l'addition. releveCliente(), dans
      # config.js, est le seul endroit où ces lignes et ces totaux sont calculés, et les cinq
      # sorties l'appellent. Cette série exécute le vrai code de l'écran et celui du Word et
      # compare leurs totaux au caractère près, plutôt que de les relire à l'œil.
      - name: Relevé du soir d'une cliente (l'écran, le PDF, l'Excel et le Word disent le même total)
        run: node tests/releve-du-soir-par-cliente.test.mjs

      # Sortir d'une fenêtre. Demandé le 27 août : « lorsqu'on veut modifier une carte ou quelque
      # chose, peu importe le compte, on ait un bouton retour ou quelque chose pour retourner, même
      # lorsqu'on rentre quelque part et qu'on veut ressortir ». Ce qui manquait n'était pas visible
      # depuis un ordinateur : chaque fenêtre savait se fermer, mais le bouton « retour » du
      # téléphone — le geste que tout le monde fait par réflexe — n'était traité NULLE PART. Avec
      # une fiche ouverte, appuyer dessus ne fermait pas la fiche, ça quittait la page, et la saisie
      # en cours partait avec. Le mécanisme vit désormais dans clt-common.js, le seul fichier chargé
      # par les huit pages, et une fenêtre s'y branche avec deux attributs dans le HTML.
      #
      # D'où deux natures de contrôles ici. Les premiers rejouent les gestes pour de bon — on ouvre,
      # on appuie sur « retour », on regarde — sur le vrai clt-common.js, avec une page simulée
      # fidèle sur le seul point qui compte : l'observateur se réveille en microtâche et « popstate »
      # arrive en tâche, jamais pendant. C'est dans ce décalage que ce genre de mécanisme se met à
      # boucler. Les seconds relisent les huit pages et exigent que chaque fenêtre en plein écran se
      # déclare : c'est la seule chose qui empêchera, dans six mois, qu'une fenêtre neuve naisse
      # muette et redevienne un piège sur un téléphone que personne ici n'utilise pour tester.
      - name: Sortir d'une fenêtre (bouton retour du téléphone, Échap, « ← Retour »)
        run: node tests/sortir-dune-fenetre.test.mjs

      # Garde-fou, deuxième espèce : un contrôle ne doit pas dépendre d'un fichier qui n'est pas
      # dans le dépôt. Le dossier _sql-prive/ décrit la base de production et n'est volontairement
      # pas publié ; il existe sur le poste de travail, jamais ici. Une série qui l'ouvre sans
      # demander d'abord s'il est là ne rend pas un verdict « échoué » — elle s'INTERROMPT, avant
      # d'avoir rien dit, et toutes les étapes suivantes sont annulées avec elle. C'est ce qui est
      # arrivé le 26 août : une série écrite et vérifiée sur un poste où le fichier existait, verte
      # cent fois de suite à la main, rouge à la seconde où elle est passée ici.
      #
      # La règle vérifiée ci-dessous est volontairement grossière — « qui parle de _sql-prive doit
      # aussi appeler existsSync » — et elle ne prétend pas prouver que la garde est au bon endroit.
      # Elle attrape la faute réelle, celle d'oublier la garde entièrement, et c'est déjà tout ce
      # qu'on lui demande. Un contrôle simple qu'on n'a pas besoin de relire vaut mieux qu'un
      # contrôle malin dans lequel on finit par ne plus avoir confiance.

      # LES SIX SÉRIES QUI EXISTAIENT SANS ÊTRE BRANCHÉES ICI. (31/08/2026)
      #
      # Le garde-fou « Aucune série de contrôles laissée de côté », plus bas, refuse la
      # publication quand un fichier de tests/ n'est branché nulle part. Il faisait donc rougir
      # CHAQUE publication depuis qu'elles ont été écrites — y compris celle du 30 août, avant
      # toute intervention de ce jour. Un contrôle rouge en permanence ne contrôle plus rien :
      # on cesse de le regarder, et le jour où il rougit pour une vraie raison, personne ne le
      # voit. Elles sont donc branchées, et elles passent toutes les six.
      - name: Le livreur annonce sa remise (une annonce n'est pas une remise)
        run: node tests/annonce-de-la-remise.test.mjs

      - name: Bilan de la semaine (ce qu'on n'a pas mesuré ne s'invente pas)
        run: node tests/bilan-hebdomadaire.test.mjs

      - name: Les colis qui dorment (le silence est l'information)
        run: node tests/colis-qui-dorment.test.mjs

      - name: L'argent que porte le livreur (ce qu'il a en main, jour après jour)
        run: node tests/l-argent-que-porte-le-livreur.test.mjs

      - name: Le serveur et l'écran comptent pareil (deux calculs, un seul résultat)
        run: node tests/le-serveur-et-l-ecran-comptent-pareil.test.mjs

      - name: Papier à en-tête (les documents sortent tous sur le même papier)
        run: node tests/papier-a-en-tete.test.mjs

      # Les écrans de déverrouillage, depuis le 31/08/2026. Ils posent leur propre décor par-dessus
      # tout l'écran ; s'ils empruntent un nom de classe à style.css, le thème du moment vient les
      # repeindre. C'est arrivé deux fois : le 19 août sur le verrou de l'application, le 31 sur la
      # page de connexion — où, en thème clair, le compte affiché et les deux options devenaient
      # du blanc sur blanc. L'écran ne tombait pas en panne : il mentait.
      - name: Écrans de déverrouillage (aucun nom de classe emprunté au thème)
        run: node tests/ecrans-de-deverrouillage.test.mjs

      # La Comptabilité générale (partie double, SYSCOHADA), ajoutée le 31 août 2026 dans l'écran
      # Gestion, à côté des États financiers en trésorerie. La balance qu'elle produit part chez
      # l'expert-comptable, la déclaration TVA remplit un document fiscal : une écriture qui ne
      # s'équilibre pas ou un compte qu'on efface en silence n'est plus une erreur d'écran. Cette
      # série exécute les fonctions pures qui tiennent ce livre — équilibre d'une écriture, balance
      # qui n'efface jamais un compte hors plan comptable, génération automatique depuis une
      # dépense (jamais pour une dépense de paie, déjà comptée par le module Paie) — et relit,
      # quand il est présent sur le poste, le SQL qui pose le trigger d'équilibre et les policies
      # protégeant la ligne de caisse liée à une facture.
      - name: Comptabilité générale (une écriture ne s'enregistre que si elle s'équilibre)
        run: node tests/comptabilite-generale.test.mjs

      # La Facturation clients, ajoutée le même jour : les clients professionnels facturés au
      # forfait/à la période (gestion_clients), population distincte du « Point clients » qui suit
      # les colis Express. Le mot affiché à côté de chaque facture — impayée, en retard, payée,
      # annulée — décide si on relance un client ou si on le laisse tranquille ; il ne doit jamais
      # être stocké, seulement recalculé, sous peine de raconter une histoire qui se désynchronise
      # de la réalité. Cette série exécute ce calcul sur des factures et des paiements choisis, et
      # garde qu'une facture annulée le reste quoi que racontent ses montants.
      - name: Facturation clients (le mot affiché ne se stocke jamais, il se recalcule)
        run: node tests/facturation-clients.test.mjs

      - name: Aucun contrôle ne dépend d'un fichier hors dépôt
        run: |
          sans_garde=""
          for f in tests/*.test.mjs; do
            if grep -q "_sql-prive" "$f" && ! grep -q "existsSync" "$f"; then
              sans_garde="$sans_garde $f"
            fi
          done
          if [ -n "$sans_garde" ]; then
            echo "Ces séries lisent _sql-prive/ sans vérifier qu'il est là :$sans_garde"
            echo "Le dossier n'est pas publié : ici, le fichier n'existe pas et la série s'arrête net."
            echo "Entourez la lecture d'un « if (!fs.existsSync(CHEMIN)) { ignorer(...) } else { … } »,"
            echo "comme le font déjà argent-des-colis, comptes-du-personnel et corriger-adresse-colis."
            exit 1
          fi
          echo "Toutes les séries qui lisent _sql-prive/ demandent d'abord s'il est là."

      # Garde-fou : ce fichier est une liste tenue à la main, et une liste tenue à la main
      # finit toujours par prendre du retard. C'est arrivé : les deux séries ci-dessus ont
      # été écrites le 21 août et n'ont été branchées ici que le 23 — pendant deux jours,
      # 157 vérifications sur 614 ne tournaient à chaque publication que si quelqu'un y
      # pensait, et personne n'y pensait. Ce contrôle compare le contenu du dossier tests/
      # à ce qui est réellement lancé ci-dessus, et refuse la publication si l'un manque.
      # Il est placé en dernier pour qu'un vrai échec de contrôle se voie avant lui.
      #
      # Il a resservi le 26 août, et c'est bien la preuve qu'il n'est pas décoratif : deux séries
      # écrites ce jour-là — la vue par jour et le relevé du soir — n'étaient branchées nulle part.
      # Les deux passaient au vert quand on les lançait à la main, ce qui est exactement le piège :
      # une série qui marche mais que personne ne lance ne protège rien du tout. Elles ont été
      # ajoutées ci-dessus avant publication, donc sans que la panne atteigne jamais le site.
      - name: Aucune série de contrôles laissée de côté
        run: |
          manquantes=""
          for f in tests/*.test.mjs; do
            grep -qF "node $f" .github/workflows/tests.yml || manquantes="$manquantes $f"
          done
          if [ -n "$manquantes" ]; then
            echo "Ces séries de contrôles existent mais ne sont lancées nulle part :$manquantes"
            echo "Ajoutez-leur une étape « - name: … / run: node <fichier> » dans .github/workflows/tests.yml."
            exit 1
          fi
          echo "Les $(ls tests/*.test.mjs | wc -l) séries du dossier tests/ sont toutes branchées."
