# Contrôles automatiques du comportement de l'application.
#
# À quoi ça sert, en clair : certains comportements ne se voient pas à l'œil nu et sont pénibles
# à vérifier à la main — typiquement ce qui se passe quand la connexion tombe au milieu d'une
# saisie. Ces contrôles rejouent ces situations tout seuls à chaque publication. Si une
# modification casse l'un d'eux, on le sait avant que l'équipe s'en aperçoive sur le terrain.
#
# Aucune configuration à faire, aucun secret, aucun coût : c'est gratuit sur un dépôt public.

name: Contrôles automatiques

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tester:
    runs-on: ubuntu-latest
    steps:
      # Ces deux outils sont fournis par GitHub, pas par nous. Ils étaient restés en v4,
      # trois versions en arrière : GitHub avertissait à chaque publication qu'ils tournent
      # sur une version de Node qu'il ne veut plus faire tourner. Un avertissement de ce
      # genre finit toujours par devenir une panne, et le jour où elle tombe, ce n'est
      # jamais le bon jour. Les seuls changements de fond entre v4 et v7 concernent la
      # récupération du code d'une branche extérieure (« fork ») — ce dépôt n'en reçoit
      # pas — et le passage à une version de Node plus récente.
      - name: Récupérer le site
        uses: actions/checkout@v7

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: File d'attente hors-réseau (espace Équipe)
        run: node tests/file-attente-equipe.test.mjs

      - name: Actions rapides (un appui pour faire avancer un colis)
        run: node tests/actions-rapides.test.mjs

      - name: Affichage par tranches (une longue liste reste fluide et exacte)
        run: node tests/liste-longue.test.mjs

      - name: Actions en lot (traiter plusieurs colis d'un coup sans rien fausser)
        run: node tests/actions-en-lot.test.mjs

      - name: Carnet d'adresses (proposer sans jamais écraser une saisie)
        run: node tests/carnet-adresses.test.mjs

      - name: Chiffres par livreur (ne jamais afficher un chiffre qu'on ne sait pas calculer)
        run: node tests/chiffres-par-livreur.test.mjs

      - name: Coller la commande (remplir vite, sans jamais deviner)
        run: node tests/coller-la-commande.test.mjs

      - name: Saisie en lot par photos d'étiquettes (une ligne vide n'est pas un colis)
        run: node tests/saisie-en-lot.test.mjs

      - name: Porte d'écriture des colis (ni doublon, ni colis dépouillé de son numéro)
        run: node tests/porte-ecriture-colis.test.mjs

      - name: États de paie par période (un mois non saisi n'est pas un mois à zéro)
        run: node tests/etats-par-periode.test.mjs

      # Celle-ci ne se contente pas de relire du texte : elle ouvre le VRAI code des
      # fonctions serveur (des fichiers .ts) et le fait tourner, avec une fausse base de
      # données qui note tout ce qu'on lui demande d'écrire. C'est ce qui permet de
      # vérifier l'ordre des écritures — couper l'accès aux données AVANT de bloquer la
      # connexion — et pas seulement leur présence. Elle a besoin d'une version de Node
      # capable de lire du TypeScript sans outil supplémentaire : c'est le cas de la 22
      # installée plus haut.
      - name: Comptes du personnel (suspendre, corriger, réinitialiser sans mot de passe en clair)
        run: node tests/comptes-du-personnel.test.mjs

      # Même principe, pour les comptes clients et CLT Express. Deux des fonctions
      # mises à l'épreuve ici sont ouvertes à tout Internet (elles servent au « mot
      # de passe oublié », donc avant toute connexion) : ce sont exactement celles
      # qu'il vaut mieux ne pas casser sans s'en rendre compte.
      - name: Comptes clients et Express (code SMS, mot de passe oublié, coupure des données)
        run: node tests/comptes-clients-et-express.test.mjs

      # Corriger l'adresse d'un colis déjà parti : les fenêtres de modification doivent dire
      # la même chose dans l'écran et dans la base. Une partie de cette série relit le script
      # SQL, qui n'est pas publié ; ici elle annonce ce qu'elle ne peut pas vérifier au lieu
      # de s'arrêter. Le reste — ce que chaque écran envoie réellement — tourne bel et bien.
      - name: Correction d'adresse d'un colis (l'écran et la base disent la même chose)
        run: node tests/corriger-adresse-colis.test.mjs

      # L'argent. Un bouton mal placé, on le signale ; un total faux, on le RECOPIE — dans un
      # carnet, dans un message, dans la remise du soir — et il devient quelques jours plus
      # tard la version des faits que plus personne ne peut contester. Cette série tient les
      # cinq règles arrêtées le 25 août : les deux poches ne se mélangent jamais, livré =
      # encaissé, encaissé n'est pas reversé, enregistré n'est pas encaissé, et l'invariant
      # encaissé = déjà reversé + reste dû. Comme la précédente, sa dernière section relit un
      # script SQL non publié et s'annonce non applicable ici plutôt que de tout arrêter.
      - name: L'argent des colis (deux poches, jamais mélangées)
        run: node tests/argent-des-colis.test.mjs

      # Le contrôle croisé des écrans. Le 25 août, le téléphone d'un livreur affichait 11 000
      # en main et le tableau de l'équipe lui en réclamait 14 000 : il avait payé 3 000 à la
      # gare le matin, sur un colis qui n'arrivait que le lendemain, et le tableau de l'équipe
      # ne regardait que les colis livrés. Personne n'avait tort — deux écrans posaient la même
      # question et comptaient différemment. C'est la seule espèce de défaut qui se termine en
      # dispute, parce que chacun tient un chiffre affiché par l'application elle-même.
      # Cette série EXÉCUTE réellement le tableau de l'équipe dans un faux navigateur et relit
      # les cellules produites une à une : son total doit valoir, au franc près, celui que le
      # téléphone du livreur calcule. Elle garde aussi qu'une avance de gare se retranche une
      # fois et une seule, et qu'un colis pas encore livré n'est jamais marqué « remis ».
      - name: Contrôle croisé des écrans (l'équipe et le livreur disent le même chiffre)
        run: node tests/controle-croise-des-ecrans.test.mjs

      # L'écran qui ne bouge pas. Signalé le 25 août : « ça s'actualise, ça vibre, et les données
      # saisies s'effacent ». L'application redessinait de grands blocs avec un contenu identique
      # à celui déjà affiché ; le navigateur, lui, ne peut pas le deviner et détruit tout. Cette
      # série extrait la vraie garde du fichier source et la fait tourner, puis monte le guet sur
      # les rechutes : aucun écran ne doit réécrire une liste sans comparer, et toute page qui
      # appelle cltPoserHTML doit charger clt-common.js — les écrans Express n'ont pas config.js.
      - name: L'écran ne se réécrit plus à l'identique (les saisies ne s'effacent plus)
        run: node tests/ecran-qui-ne-bouge-pas.test.mjs

      # La fiche « Son écran ». Jusqu'ici, personne à l'équipe ne pouvait voir ce qu'un livreur —
      # ou une vendeuse — a réellement sous les yeux : on assignait des colis toute la journée
      # sans jamais pouvoir vérifier l'autre bout. La fiche répond à ça, mais la façon évidente
      # de l'écrire aurait été de redessiner un tableau RESSEMBLANT à celui du livreur — donc un
      # TROISIÈME chiffre, et le seul dont personne n'aurait su lequel des deux autres il
      # contredit. Cette série exécute réellement les deux écrans sur les mêmes colis et compare
      # les tableaux produits CARACTÈRE POUR CARACTÈRE. Elle garde aussi la porte de correction :
      # une seule écriture dans toute la fiche, la trace au journal posée après l'écriture et
      # jamais avant, et « corriger les montants » qui n'écrit rien du tout.
      - name: La fiche « Son écran » (l'équipe voit exactement ce que le livreur voit)
        run: node tests/fiche-son-ecran.test.mjs

      # Le bandeau « nouvelle version disponible ». Le 26 août, la fiche « Son écran » a été
      # publiée, vérifiée fichier par fichier sur le serveur, et est restée invisible une
      # journée entière : une application installée ne recharge pas toute seule, et rien ne
      # lui disait qu'une nouvelle version existait. Publier « avec succès » sans que rien ne
      # change pour personne est le pire des deux mondes. Cette série garde les deux pièges du
      # remède : ne JAMAIS recharger d'autorité (une actualisation pendant une saisie efface
      # les champs — le défaut déjà signalé en août), et ne jamais crier au loup quand on ne
      # sait pas (réseau coupé, repère illisible). Elle refuse aussi la publication si
      # app/version.json cesse d'annoncer exactement l'étiquette portée par les pages : en
      # avance, le bandeau s'affiche en permanence et ne veut plus rien dire ; en retard,
      # plus personne ne le voit et on retombe dans le trou du 26 août.
      - name: Le bandeau « nouvelle version » (l'équipe apprend qu'une publication a eu lieu)
        run: node tests/bandeau-nouvelle-version.test.mjs

      # Le choix du livreur dans « Tous les colis ». Un filtre a l'air anodin, mais il décide de
      # ce que l'écran MONTRE, donc de ce que l'équipe croit exister. Deux pièges gardés ici :
      # confondre « tous les livreurs » avec « pas encore assignés » ferait disparaître de la vue
      # les colis qui n'ont été confiés à personne — précisément ceux qu'il ne faut jamais perdre
      # de vue ; et changer de livreur sans vider la sélection multiple laisserait des colis
      # cochés invisibles, qu'une assignation en lot ramasserait au passage.
      - name: Choix du livreur dans la liste des colis (voir le travail d'un seul, sans rien perdre)
        run: node tests/filtre-par-livreur.test.mjs

      # La barre du haut, le bandeau de mise à jour, et le bouton 🔄. Signalés ensemble le
      # 26 août : l'ancienne saisie encombrait tous les écrans, la roue dentée se retrouvait
      # seule à gauche sur une troisième ligne et son menu s'ouvrait hors de l'écran, le
      # bandeau de mise à jour se posait sur l'heure et sur l'en-tête, et le bouton
      # d'actualisation « avait l'air de ne rien faire ». La dernière section de cette série
      # ne relit pas le bouton : elle l'EXÉCUTE, avec une horloge qu'on avance à la main, et
      # rejoue le cas qui ne se voit pas à la lecture — une requête qui ne revient jamais
      # laissait le bouton grisé pour toujours, et là il n'avait plus seulement l'air mort.
      - name: Barre du haut, bandeau de mise à jour et bouton d'actualisation
        run: node tests/barre-du-haut-et-actualiser.test.mjs

      # Le récapitulatif par livreur, et le haut de la fiche « Son écran ». Demandés ensemble le
      # 26 août : on ne pouvait vérifier un livreur qu'en trouvant sa ligne dans la comptabilité,
      # et la fiche qui s'ouvrait alors avait son titre et sa croix imprimés sous la barre d'état
      # du téléphone — « même pour vouloir sortir de là, c'est vraiment difficile ». Cette série
      # garde surtout l'essentiel : l'addition d'argent a été sortie de l'écran de comptabilité
      # et posée dans config.js, et les DEUX écrans l'appellent. Elle vérifie qu'il n'en existe
      # qu'une, que ses chiffres sont justes jusqu'au cas où CLT doit de l'argent au livreur, et
      # que la colonne affichée se recompose exactement en le total de la caisse.
      - name: Récapitulatif par livreur et haut de la fiche « Son écran »
        run: node tests/recapitulatif-par-livreur.test.mjs

      # Garde-fou : ce fichier est une liste tenue à la main, et une liste tenue à la main
      # finit toujours par prendre du retard. C'est arrivé : les deux séries ci-dessus ont
      # été écrites le 21 août et n'ont été branchées ici que le 23 — pendant deux jours,
      # 157 vérifications sur 614 ne tournaient à chaque publication que si quelqu'un y
      # pensait, et personne n'y pensait. Ce contrôle compare le contenu du dossier tests/
      # à ce qui est réellement lancé ci-dessus, et refuse la publication si l'un manque.
      # Il est placé en dernier pour qu'un vrai échec de contrôle se voie avant lui.
      - name: Aucune série de contrôles laissée de côté
        run: |
          manquantes=""
          for f in tests/*.test.mjs; do
            grep -qF "node $f" .github/workflows/tests.yml || manquantes="$manquantes $f"
          done
          if [ -n "$manquantes" ]; then
            echo "Ces séries de contrôles existent mais ne sont lancées nulle part :$manquantes"
            echo "Ajoutez-leur une étape « - name: … / run: node <fichier> » dans .github/workflows/tests.yml."
            exit 1
          fi
          echo "Les $(ls tests/*.test.mjs | wc -l) séries du dossier tests/ sont toutes branchées."
